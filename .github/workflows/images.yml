name: images
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    paths: ["images/**", "cmd/**", "internal/**", "deploy/terraform/**", "go.mod", "go.sum", ".dockerignore", ".github/workflows/images.yml"]
  schedule:
    - cron: "23 3 * * *" # nightly patch refresh of the latest release
  workflow_dispatch:
permissions:
  contents: read
jobs:
  version:
    permissions:
      contents: read
      checks: read # the release gate reads the commit's check-runs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      major: ${{ steps.version.outputs.major }}
      publish: ${{ steps.version.outputs.publish }}
      tag: ${{ steps.version.outputs.tag }}
      move_major: ${{ steps.version.outputs.move_major }}
      kinds: ${{ steps.kinds.outputs.kinds }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # A tag push publishes nothing unless the tag is on main and its checks
      # passed (the same gate release.yml runs).
      - name: Release gate
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: scripts/release-gate.sh "$TAG"
      # The same Highlights check as release.yml: a tag release.yml refuses
      # must not leave images published behind it (the tag cannot be moved).
      - name: Highlights file
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/release-policy.sh check-highlights "${TAG#v}"
      - name: Pick the version
        id: version
        run: |
          set -eu
          publish=true
          tag=""
          case "$GITHUB_EVENT_NAME" in
            push)
              tag=$GITHUB_REF_NAME
              if ! printf '%s\n' "$tag" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
                echo "::error::pushed tag '$tag' is not a strict vX.Y.Z release tag" >&2
                exit 1
              fi
              ;;
            pull_request)
              version="pr-${{ github.event.number }}"
              publish=false
              ;;
            *)
              # Nightly/dispatch: the latest strict vX.Y.Z release tag, never
              # a pre-release like v1.2.3-rc1.
              tag=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
              if [ -z "$tag" ]; then
                version=nightly
                publish=false
              fi
              ;;
          esac
          # :<major> moves only to the highest strict release in that major,
          # so a backport tag (v1.1.5 after v1.2.0) publishes :1.1.5 alone.
          move_major=false
          if [ -n "$tag" ]; then
            version=${tag#v}
            top=$(git tag -l "v${version%%.*}.*" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
            if [ "$top" = "$tag" ]; then
              move_major=true
            fi
          fi
          {
            echo "version=$version"
            echo "major=${version%%.*}"
            echo "publish=$publish"
            echo "tag=$tag"
            echo "move_major=$move_major"
          } >> "$GITHUB_OUTPUT"
      # The nightly and manual runs build the latest release tag's tree, and an
      # older tag does not hold every image (a tag before the 0.7.0 cut has no
      # images/base): an image whose Dockerfile is not in the tree being built
      # has nothing to build, publish or verify, and its legs are skipped
      # instead of failing every night. web-node, go and java-services are
      # gone from this list: this same diff deletes the per-kind "base" job
      # that was their only reader, so no job checks for those kinds any more
      # — keeping them here would be dead code, not backport support (a
      # backport run still uses this workflow file as committed on the
      # default branch, which has no job left to gate on them, whichever tag
      # it checks out mid-job).
      - name: Which images this tree builds
        id: kinds
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -eu
          ref=HEAD
          if [ -n "$TAG" ]; then
            ref="refs/tags/$TAG"
          fi
          kinds=,
          for k in history base; do
            if git cat-file -e "$ref:images/$k/Dockerfile" 2>/dev/null; then
              kinds="$kinds$k,"
            fi
          done
          echo "kinds=$kinds" >> "$GITHUB_OUTPUT"
  # The history job's image (design D11): built and checked on every run and
  # published with the base on a release tag (the publish job below).
  history:
    needs: version
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: contains(needs.version.outputs.kinds, ',history,')
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Checkout the resolved tag
        if: contains(needs.version.outputs.kinds, ',history,') && needs.version.outputs.tag != ''
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: git checkout --quiet "refs/tags/$TAG"
      - name: Build
        if: contains(needs.version.outputs.kinds, ',history,')
        env:
          FUGARO_VERSION: ${{ needs.version.outputs.version }}
        run: images/build-base.sh history fugaro-history:ci
      - name: Smoke test
        if: contains(needs.version.outputs.kinds, ',history,')
        run: images/smoke-history.sh fugaro-history:ci
      - name: Scan
        if: contains(needs.version.outputs.kinds, ',history,') && github.event_name != 'pull_request'
        run: images/scan.sh fugaro-history:ci
      - name: Save the image for the publish job
        if: contains(needs.version.outputs.kinds, ',history,') && needs.version.outputs.publish == 'true'
        run: docker save "fugaro-history:ci" | gzip > "fugaro-history.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: contains(needs.version.outputs.kinds, ',history,') && needs.version.outputs.publish == 'true'
        with:
          name: fugaro-history-image
          path: fugaro-history.tar.gz
          retention-days: 1
  # The one base (design base-image.md): built natively per architecture,
  # smoke-tested (every pin and every tools.tsv row), held to its size
  # budget and scanned for secrets on every run, scanned for
  # vulnerabilities off pull requests, and saved for publish-base.
  fugaro-base:
    needs: version
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned, not ubuntu-latest: on ubuntu-26.04 docker uses the
          # containerd image store, whose build saves an index with a
          # provenance attestation and whose RepoDigests also lists the
          # local docker.io name, which broke publish-base for v0.11.4.
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: contains(needs.version.outputs.kinds, ',base,')
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Checkout the resolved tag
        if: contains(needs.version.outputs.kinds, ',base,') && needs.version.outputs.tag != ''
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: git checkout --quiet "refs/tags/$TAG"
      # The runner's disk is about 14 GB free; the base and its saved
      # archive need room.
      - name: Free disk space
        if: contains(needs.version.outputs.kinds, ',base,')
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: Build
        if: contains(needs.version.outputs.kinds, ',base,')
        env:
          FUGARO_VERSION: ${{ needs.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
          # Each architecture must push as one plain image manifest: the
          # index check in publish-base wants exactly the two children it
          # pushed, and a default provenance attestation adds a third.
          BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
        run: PLATFORM="linux/$ARCH" images/build-base.sh base fugaro-base:ci
      - name: Smoke test
        if: contains(needs.version.outputs.kinds, ',base,')
        run: images/smoke.sh fugaro-base:ci base
      - name: Size budget
        if: contains(needs.version.outputs.kinds, ',base,')
        run: images/size-budget.sh fugaro-base:ci
      - name: Secret scan
        if: contains(needs.version.outputs.kinds, ',base,')
        run: images/scan.sh --secrets fugaro-base:ci
      - name: Vulnerability scan
        if: contains(needs.version.outputs.kinds, ',base,') && github.event_name != 'pull_request'
        run: images/scan.sh fugaro-base:ci
      - name: Save the image for publish-base
        if: contains(needs.version.outputs.kinds, ',base,') && needs.version.outputs.publish == 'true'
        env:
          ARCH: ${{ matrix.arch }}
        run: docker save fugaro-base:ci | gzip > "fugaro-base-$ARCH.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: contains(needs.version.outputs.kinds, ',base,') && needs.version.outputs.publish == 'true'
        with:
          name: fugaro-base-${{ matrix.arch }}-image
          path: fugaro-base-${{ matrix.arch }}.tar.gz
          retention-days: 1
  # Pushes each architecture under <version>-<arch>, then the
  # multi-platform index <version> (and <major> when it moves) from the two
  # pushed digests, and — on a real tag push — signs that index by the
  # digest `imagetools create --metadata-file` reported, verifies its own
  # signature, and only then points the nightly-immune <version>-pinned tag
  # at the signed digest. The digest to sign is never learned by re-reading
  # a tag: a tag can be moved by anyone who can write this repository's
  # tags, and a signature must never cover a digest learned from one. This
  # job and publish are the only ones with packages: write; id-token: write
  # is here alone, for the keyless (OIDC) signing step and nothing else.
  publish-base:
    needs: [version, fugaro-base]
    if: needs.version.outputs.publish == 'true' && contains(needs.version.outputs.kinds, ',base,')
    concurrency:
      group: images-publish-base
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      # The keyless signing step asks Fulcio for a certificate through
      # GitHub's OIDC issuer: that, and only that, is what this grants. The
      # -pinned tag push itself is an ordinary registry write and needs
      # only the packages: write above. GitHub grants permissions per job,
      # not per step, so this is the narrowest scope available: it is not
      # on any other job in this workflow, and it is on the one job that
      # already holds packages: write and already runs on a tag push only.
      id-token: write
    # Same image store as the amd64 build leg (see its runner pin).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fugaro-base-*-image
          merge-multiple: true
      - name: Push per architecture and publish the index
        id: index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          VERSION: ${{ needs.version.outputs.version }}
          MAJOR: ${{ needs.version.outputs.major }}
          MOVE_MAJOR: ${{ needs.version.outputs.move_major }}
        run: |
          set -eu
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          repo=ghcr.io/dimipaun/fugaro-base
          digests=""
          for arch in amd64 arm64; do
            gunzip -c "fugaro-base-$arch.tar.gz" | docker load
            docker tag fugaro-base:ci "$repo:$VERSION-$arch"
            docker push "$repo:$VERSION-$arch"
            # The digest under $repo, not RepoDigests[0]: the containerd
            # image store also lists the loaded local name
            # (fugaro-base@sha256:...), which imagetools would read from
            # Docker Hub and be refused.
            pushed_ref=$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$repo:$VERSION-$arch" | grep -F "$repo@" | head -n 1)
            if [ -z "$pushed_ref" ]; then
              echo "::error::no $repo@ digest for $repo:$VERSION-$arch after its push" >&2
              exit 1
            fi
            digests="$digests $pushed_ref"
            docker image rm fugaro-base:ci "$repo:$VERSION-$arch" >/dev/null
          done
          tags="--tag $repo:$VERSION"
          if [ "$MOVE_MAJOR" = true ]; then
            tags="$tags --tag $repo:$MAJOR"
          fi
          # --metadata-file is where the index's own digest comes from: a
          # later step signs exactly that digest, and nothing ever learns
          # it by asking a tag what it resolves to. A tag is a second,
          # movable registry answer, and a signature must not cover a
          # digest learned from one. The pinned tag below is written only
          # after the signature exists, for that same reason.
          # shellcheck disable=SC2086
          docker buildx imagetools create $tags $digests --metadata-file index.json
          # The FILE's shape is the one docker's own docs show for
          # "imagetools create --metadata-file": {"containerimage.descriptor":
          # {"mediaType": ..., "digest": "sha256:...", "size": ...},
          # "image.name": ...} — a "containerimage.digest" key is
          # `buildx build`'s, not this command's (checked against
          # docs.docker.com 2026-10-15). A missing or malformed digest
          # fails the job rather than signing something unknown.
          index=$(jq -r '."containerimage.descriptor".digest' index.json)
          if ! printf '%s' "$index" | grep -qE '^sha256:[0-9a-f]{64}$'; then
            echo "::error::docker buildx imagetools create --metadata-file reported no index digest (got '$index')" >&2
            exit 1
          fi
          # The published index must be built from exactly the two child
          # manifests THIS job pushed: an index whose children are anything
          # else is not this job's build, whatever its digest says.
          pushed=""
          for d in $digests; do pushed="$pushed ${d##*@}"; done
          published=$(docker buildx imagetools inspect --raw "$repo@$index" | jq -r '.manifests[]?.digest' | sort | tr '\n' ' ')
          want=$(printf '%s\n' $pushed | sort | tr '\n' ' ')
          if [ "$published" != "$want" ]; then
            echo "::error::$repo@$index has child manifests '$published', not the digests this job pushed ('$want')" >&2
            exit 1
          fi
          echo "digest=$index" >> "$GITHUB_OUTPUT"
          {
            echo '### fugaro-base'
            for arch in amd64 arm64; do
              mb=$(docker buildx imagetools inspect "$repo:$VERSION-$arch" --raw | jq '[.layers[].size] | add / 1000000 | floor')
              echo "- $arch: $mb MB compressed"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      # Keyless: the certificate comes from Fulcio through GitHub's OIDC
      # issuer (the id-token: write above), and the signature is attached as
      # its own OCI artifact in this same ghcr.io repository — no GitHub
      # Release asset, no cross-workflow coordination. Gated to a tag push:
      # the version job already picks "the latest release tag" for the
      # nightly and a dispatch alike, so there is no manual re-run of a tag
      # this guard would wrongly skip, and the nightly must never sign (it
      # never writes -pinned either). Both are exact conditions, not
      # substrings: a widened one would sign on an event this release's
      # identity does not cover.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name == 'push'
      # Signing is by DIGEST, taken from the same job's own
      # --metadata-file output above — never by re-reading a tag. Re-reading
      # :$VERSION-pinned (or :$VERSION) would be a second registry answer
      # that anyone who can write this repository's tags could change
      # between the create and the read, putting this release's signing
      # identity on THEIR image.
      - name: Sign the published index
        id: sign
        if: github.event_name == 'push'
        env:
          VERSION: ${{ needs.version.outputs.version }}
          DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          # pipefail: this shell has no pipeline today, so it is inert; it
          # keeps a later edit that adds one from silently swallowing a
          # failure, which is what every set -eu in this chain is for.
          set -eu
          set -o pipefail
          repo=ghcr.io/dimipaun/fugaro-base
          cosign sign --yes "$repo@$DIGEST"
      # An independent read-back of what was actually attached, before
      # anything points at the signed digest. The identity is THIS workflow
      # on THIS tag push and nobody else's — and the identity alone is not
      # enough to say "tag push": a workflow_dispatch run started against a
      # tag ref gets the very same `...images.yml@refs/tags/vX.Y.Z`
      # certificate subject. The trigger and repository extensions are what
      # distinguish them, so both are required too
      # (--certificate-github-workflow-trigger/-repository, which check the
      # Fulcio extensions 1.3.6.1.4.1.57264.1.2 "event_name" and
      # 1.3.6.1.4.1.57264.1.5 "repository"; flag names confirmed against
      # cosign's own v3 verify docs). cosign verify uses the transparency
      # log and binds the artifact digest, so no --insecure-ignore-tlog and
      # no "verify without an artifact" mode is used anywhere here or below.
      - name: Verify the signature just attached
        id: verify
        if: github.event_name == 'push'
        env:
          VERSION: ${{ needs.version.outputs.version }}
          DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          set -eu
          set -o pipefail
          repo=ghcr.io/dimipaun/fugaro-base
          cosign verify \
            --certificate-identity "https://github.com/dimipaun/fugaro/.github/workflows/images.yml@refs/tags/v$VERSION" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-github-workflow-trigger "push" \
            --certificate-github-workflow-repository "dimipaun/fugaro" \
            "$repo@$DIGEST"
      # Only now, with the signature made and verified, does anything name
      # <version>-pinned: a copy-time resolve reads this tag, and this job
      # never does. One source that is an index is a carbon copy (docker's
      # own docs), so the tag names the very digest that was signed; the
      # read-back below then proves it rather than trusting the create.
      - name: Publish the -pinned tag at the signed digest
        id: pinned
        if: github.event_name == 'push'
        env:
          VERSION: ${{ needs.version.outputs.version }}
          DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          set -eu
          repo=ghcr.io/dimipaun/fugaro-base
          docker buildx imagetools create --tag "$repo:$VERSION-pinned" "$repo@$DIGEST"
          got=$(docker buildx imagetools inspect "$repo:$VERSION-pinned" --format '{{.Manifest.Digest}}')
          if [ "$got" != "$DIGEST" ]; then
            echo "::error::$repo:$VERSION-pinned resolves to $got, not the signed digest $DIGEST" >&2
            exit 1
          fi
  # This job and publish-base are the only ones that need packages: write,
  # and neither ever runs on pull_request: `version.outputs.publish` is
  # forced false there. After the 0.7.0 cut the only image left in this
  # job's own matrix is history; the base publishes through publish-base
  # above instead.
  publish:
    needs: [version, history]
    if: needs.version.outputs.publish == 'true'
    # Publishes of one image queue rather than race: move_major is decided
    # from the tags present when the version job ran, so two close tag pushes
    # in one major must push in order or :<major> could end on the older one.
    # The group is per image: GitHub keeps one PENDING job per group and
    # cancels the others, so a single shared group cancelled two of the four
    # matrix legs of the v0.2.0 release.
    concurrency:
      group: images-publish-${{ matrix.base }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        base: [history]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: contains(needs.version.outputs.kinds, format(',{0},', matrix.base))
        with:
          name: fugaro-${{ matrix.base }}-image
      - name: Load and publish
        if: contains(needs.version.outputs.kinds, format(',{0},', matrix.base))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          VERSION: ${{ needs.version.outputs.version }}
          MAJOR: ${{ needs.version.outputs.major }}
          MOVE_MAJOR: ${{ needs.version.outputs.move_major }}
        run: |
          set -eu
          gunzip -c "fugaro-${{ matrix.base }}.tar.gz" | docker load
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          tags=$VERSION
          if [ "$MOVE_MAJOR" = true ]; then
            tags="$tags $MAJOR"
          fi
          for t in $tags; do
            docker tag "fugaro-${{ matrix.base }}:ci" "ghcr.io/dimipaun/fugaro-${{ matrix.base }}:$t"
            docker push "ghcr.io/dimipaun/fugaro-${{ matrix.base }}:$t"
          done
  # A new ghcr.io package is private until its owner makes it public once by
  # hand (docs/release.md). This job has no packages permission and never logs
  # in, so it sees what an anonymous user (the mirror, a plain docker pull)
  # sees, and it fails the release when a published image is not pullable or
  # has no linux/amd64 build (and, for fugaro-base, linux/arm64). Digests go
  # to the run summary.
  verify-public:
    needs: [version, publish, publish-base]
    # publish-base is legitimately skipped when kinds has no base (an older
    # tag's tree, e.g. a backport): GitHub's default auto-skip ("a job is
    # skipped if any of its needs did not succeed") would then skip this job
    # too, leaving the published history image with no anonymous-pull check.
    # always() overrides that default, so the explicit checks below carry the
    # whole gate: publish must have succeeded, and when the kinds include base
    # publish-base must have SUCCEEDED too (a failed, cancelled or skipped
    # publish-base, say after the secret scan failed, must not let this job
    # report a green for yesterday's image that was never refreshed). Only
    # when there is no base kind is a skipped publish-base fine.
    if: >-
      always() &&
      needs.version.outputs.publish == 'true' &&
      needs.publish.result == 'success' &&
      (needs['publish-base'].result == 'success' ||
      !contains(needs.version.outputs.kinds, ',base,'))
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pull-check every published image without a login
        env:
          VERSION: ${{ needs.version.outputs.version }}
          MAJOR: ${{ needs.version.outputs.major }}
          MOVE_MAJOR: ${{ needs.version.outputs.move_major }}
          KINDS: ${{ needs.version.outputs.kinds }}
        run: |
          set -eu
          refs=""
          for img in history; do
            # An older tag's tree does not hold every image: only what was published.
            case "$KINDS" in *",$img,"*) ;; *) continue ;; esac
            refs="$refs ghcr.io/dimipaun/fugaro-$img:$VERSION"
            if [ "$MOVE_MAJOR" = true ]; then
              refs="$refs ghcr.io/dimipaun/fugaro-$img:$MAJOR"
            fi
          done
          if [ -n "$refs" ]; then
            # shellcheck disable=SC2086
            images/verify-public.sh $refs | tee verify.log
          else
            : > verify.log
          fi
          if case "$KINDS" in *",base,"*) true ;; *) false ;; esac; then
            base="ghcr.io/dimipaun/fugaro-base:$VERSION"
            if [ "$MOVE_MAJOR" = true ]; then base="$base ghcr.io/dimipaun/fugaro-base:$MAJOR"; fi
            # shellcheck disable=SC2086
            images/verify-public.sh --arm64 $base | tee -a verify.log
          fi
          if [ ! -s verify.log ]; then
            echo "no image was published from this tree: nothing to verify"
            exit 0
          fi
          { echo '### Published images'; echo; sed 's/^verify-public: /- /' verify.log; } >> "$GITHUB_STEP_SUMMARY"
  docker-tests:
    if: github.event_name != 'push'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

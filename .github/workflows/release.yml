name: release
# A strict vX.Y.Z tag push ALSO triggers images.yml (base images on ghcr.io);
# the two workflows are independent. See docs/release.md.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    paths: [".goreleaser.yaml", ".github/workflows/release.yml", "scripts/bump-plugin-version.sh"]
  workflow_dispatch: # dry run: a snapshot build, nothing published or signed
permissions:
  contents: read
jobs:
  # Lints the config on PRs. Not a required check.
  check:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.2
          args: check
      - name: Plugin version script
        run: scripts/bump-plugin-version.sh --check "$(jq -r .version plugin/.claude-plugin/plugin.json)"

  # Manual rehearsal: builds every archive and SBOM, publishes and signs nothing.
  dry-run:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: anchore/sbom-action/download-syft@fffec3d851af758d56fee099cf3fbf8aa8779843 # v0.24.3
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        env:
          HOMEBREW_TAP_GITHUB_TOKEN: ""
        with:
          version: v2.18.2
          args: release --snapshot --clean --skip=publish,sign
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: goreleaser-dist
          path: dist/
          retention-days: 7

  release:
    if: github.event_name == 'push'
    permissions:
      contents: write # create the release and upload its assets
      id-token: write # cosign keyless signing
    # Releases queue rather than race.
    concurrency:
      group: release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The tag is strict, on main, and its checks passed
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          if ! printf '%s\n' "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::pushed tag '$TAG' is not a strict vX.Y.Z release tag" >&2
            exit 1
          fi
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG ($GITHUB_SHA) is not on main; tag a commit that is reachable from main" >&2
            exit 1
          fi
          for name in test terraform rules; do
            concl=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" \
              --jq "[.check_runs[] | select(.name == \"$name\") | .conclusion] | if length == 0 then \"missing\" elif all(. == \"success\") then \"success\" else \"failed\" end")
            if [ "$concl" != success ]; then
              echo "::error::required check '$name' is $concl on $GITHUB_SHA" >&2
              exit 1
            fi
          done
          scripts/bump-plugin-version.sh --check "${TAG#v}"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@fffec3d851af758d56fee099cf3fbf8aa8779843 # v0.24.3
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Empty when the secret is absent: the formula upload is then skipped.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        with:
          version: v2.18.2
          args: release --clean
      - name: Mark a pre-1.0 release as a pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            v0.*) gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease ;;
          esac

# The tagged (ee) edition, vetted, tested and built (ee-reorg plan, task E1.6).
#
# G1 has two halves. `internal/eeboundary` proves the core never imports,
# embeds or routes into ee/, and the staged core-without-ee.yml proves the
# module builds and passes its suite with the directory deleted. Neither
# touches the edition that ships to an Enterprise installation: the one
# `//go:build ee` compiles, where cmd/fugaro/ee_on.go is in the build and the
# ee/ packages are assembled into the command tree. That is what this job
# checks, and a runner is the only thing that can.
#
# It is a file of its own rather than a job in ci.yml: a staged
# docs/pending-workflows/ci.yml turns
# TestDocsComputeBackendCIReachMatchesTheTree red (the compute-backend plan's
# Global Constraint 3 says its staged request was applied to the workflow
# instead and nothing was re-staged) and images/cloudbuild_test.go reads that
# path. It is in no required-check list and gates no release.
#
# The one claim to read carefully before editing: the ee test step is guarded
# on `go list ./ee/...`. ee/ holds no Go package yet -- E1.5's assembly file
# and the E2.x moves add the first ones -- and `go test ./ee/...` exits
# non-zero on a directory with no packages ("no packages to test"). The guard
# lists what is there and says so in the log rather than failing; it is not a
# stand-in for the run, which happens the moment a package exists, and it goes
# with the first package under ee/.
#
# Both tagged steps below are vacuous until a file carries the constraint: no
# file in the tree carries `//go:build ee` as this task lands, so today the
# `-tags ee` steps compile exactly the untagged tree and prove nothing about
# the tagged edition yet. They are staged anyway because they are what the
# file is, and E1.5/E1.1 -- which add cmd/fugaro/ee_on.go -- are what give them
# something to compile; no edit to this file is needed when they land.
#
# Staged under docs/pending-workflows/ because no Fugaro run may write under
# .github/workflows/ (GitHub refuses the push). Moving it in -- together with
# core-without-ee.yml, the other half of G1 -- and what to update afterwards,
# is in the README beside this file.
name: ee-edition

# A push to main, and the owner's manual dispatch: the same pair ci.yml and
# core-without-ee.yml carry. A pull request would run it on every branch, and a
# second branch would run it on a tree no release is cut from. There is no path
# filter: the change that breaks the tagged build is as likely to be in
# internal/ as in go.mod.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege, at the top so that no step can widen it by omission. The
# job reads the repository and writes nothing -- it compiles into the
# checkout's own working tree and uploads no artifact -- and it holds no secret
# at all.
permissions:
  contents: read

jobs:
  ee-edition:
    runs-on: ubuntu-latest
    # The heaviest step is `go vet -tags ee ./...`, which compiles the whole
    # module; ci.yml's test job does the same compile inside its own 30-minute
    # bound, so this job fits there with room for a slow runner. Without a
    # bound, a hung compile holds a runner until GitHub's six-hour default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The `ee` tag is what compiles cmd/fugaro/ee_on.go and assembles the ee
      # packages into the command tree, so this is the tagged edition's vet --
      # the build core-without-ee.yml never makes. Until a file carries the
      # constraint (the header) it compiles the untagged tree like any other
      # vet, and it becomes the tagged check the moment one does.
      - run: go vet -tags ee ./...
      # ee/ holds no Go package yet, and `go test ./ee/...` exits non-zero on a
      # directory with no packages. The guard says so rather than failing; the
      # moment a package exists it runs the real command. It carries no tag:
      # the ee packages build without `//go:build ee` (only
      # cmd/fugaro/ee_on.go carries it), so they are tested in the default
      # build too, which is where the core's own suite sees them.
      - name: the ee packages' tests
        run: |
          if [ -z "$(go list ./ee/... 2>/dev/null)" ]; then
            echo "ee/ holds no Go package yet; nothing to test (E1.5, E2.x add them)"
            exit 0
          fi
          go test ./ee/... -count=1
      # The tagged binary, the artifact an Enterprise installation ships. This
      # is the step that fails if ee_on.go or an ee/ package stops compiling
      # under the tag, and it catches nothing the untagged build would not until
      # one of them exists (the header).
      - run: go build -tags ee ./cmd/fugaro

version: 1
project: acme
git: { provider: github, base_branch: main }
workflows:
  api:
    dockerfile: .fugaro/api.Dockerfile
    commands:
      build: cd services/api && go build ./...
      test: cd services/api && go test ./...
  web:
    commands:
      build: cd web && pnpm build
      test: cd web && pnpm test

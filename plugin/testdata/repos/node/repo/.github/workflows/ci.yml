name: ci
on:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: sudo apt-get install -y libvips-dev
      - run: npm ci
      - run: npm run build
      - run: CI=true npm test

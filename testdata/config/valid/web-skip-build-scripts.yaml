version: 1
project: aurora
git: { provider: github }
workflows:
  web:
    base: web-node
    image:
      skip_build_scripts: true
    commands: { build: yarn build, test: yarn test }
  server:
    base: java-services
    image: { skip_build_scripts: false }
    commands: { build: ./gradlew assemble, test: ./gradlew test }

version: 1
project: aurora
git: { provider: github }
agent:
  auth: api-key
  model: claude-sonnet-5-5
  models:
    coder: claude-opus-5-5
    reviewer: claude-sonnet-5-5
    background: claude-haiku-4-5
  max_output_tokens: { coder: 64000, reviewer: 32000 }
  max_run_tokens: 5000000
workflows:
  server: { base: server-jvm, commands: { build: make, test: make test } }

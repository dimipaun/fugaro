version: 1
project: aurora
git: { provider: github }
workflows:
  web:
    image:
      tools: { node: "24.19.0" }
      apt: [libvips-dev, fonts-liberation=1:2.1.5-3]
      setup: ["npx playwright install --with-deps chromium"]
    commands: { build: npm run build, test: npm test }
  server:
    image: { apt: [python3] }
    commands: { build: ./gradlew assemble, test: ./gradlew test }

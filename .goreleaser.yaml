# GoReleaser v2. Run by .github/workflows/release.yml on a vX.Y.Z tag; see docs/release.md.
version: 2
project_name: fugaro

before:
  hooks:
    - go mod verify
    # The archive ships the notices of every module the binary links; the
    # script writes the file into the tree here, before the builds and the
    # archive, and the archive's file list below carries it (D307).
    - ./scripts/third-party-notices.sh THIRD_PARTY_NOTICES.md

# Two builds of the same main, and the only difference between them is the ee
# tag: the tagged one is the mixed-licence build every label, `fugaro update`,
# the console's CLI discovery and the plugin pin follow, and the untagged one is
# the pure-MIT build a user who wants no ee/ code downloads (the owner's T3 (c)
# ruling of 2026-11-11). Both ship the binary under the name `fugaro`, so the
# archives below select their build by id rather than by name, and
# scripts/notices_test.go holds the two builds to being the same build but for
# that tag.
builds:
  - id: fugaro
    main: ./cmd/fugaro
    binary: fugaro
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    # The released binary is the mixed-licence one: MIT core plus the ee/ code
    # under the Subscription terms (D447, T21). Every licence label names that
    # split, and scripts/notices_test.go refuses the tag without them.
    tags: [ee]
    ldflags:
      - -s -w -X github.com/dimipaun/fugaro/internal/cli.Version={{ .Version }} -X github.com/dimipaun/fugaro/internal/cli.Commit={{ .FullCommit }}
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: fugaro-core
    main: ./cmd/fugaro
    binary: fugaro
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    # No `ee` tag, and that is the whole point: `cmd/fugaro/ee_on.go` is not
    # compiled, so nothing under ee/ reaches this binary and it is the MIT core
    # alone (D303 as amended, T3 (c)). scripts/notices_test.go refuses a tag
    # here, and the archive below carries no `ee/LICENSE` copy for the same
    # reason.
    ldflags:
      - -s -w -X github.com/dimipaun/fugaro/internal/cli.Version={{ .Version }} -X github.com/dimipaun/fugaro/internal/cli.Commit={{ .FullCommit }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  # The mixed-licence archive: the reader who follows the release page, the
  # Homebrew cask, `fugaro update`, the console's CLI discovery and the plugin
  # pin all land here (the owner's answers of 2026-11-11).
  - id: fugaro
    # An archive with no `ids` takes every build's binary, and both builds write
    # a file called `fugaro`: without this the tagged binary could travel under
    # the core archive's name, which is the one mix-up that would license ee/
    # code as MIT. scripts/notices_test.go pins both archives to their build.
    ids: [fugaro]
    formats: [tar.gz]
    name_template: "fugaro_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      # The binary carries ee/ code, whose licence (clause 8.1) has to travel
      # with every copy; this is the byte-for-byte copy of ee/LICENSE, outside
      # ee/ so no archive path reaches the reserved directory.
      - LICENSES/LicenseRef-Fugaro-Subscription.txt
      - README.md
      - THIRD_PARTY_NOTICES.md

  # The pure-MIT archive (T3 (c), plan task L5.3): the same binary without the
  # tag, so it carries no `ee/LICENSE` copy and nothing that names the
  # Subscription terms as its own. `fugaro update`, the console's CLI discovery
  # and the plugin pin stay on the mixed-licence archive above, and no Homebrew
  # cask points here: this is the download for a user who wants no ee/ code
  # rather than a second install path (the owner's answers of 2026-11-11).
  - id: fugaro-core
    ids: [fugaro-core]
    formats: [tar.gz]
    name_template: "fugaro-core_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - THIRD_PARTY_NOTICES.md

checksum:
  name_template: checksums.txt

# One SBOM per archive; needs the syft binary on PATH (the workflow installs it).
sboms:
  - id: archive
    artifacts: archive

# Keyless cosign signature of checksums.txt through GitHub OIDC. The bundle
# carries the signature and the Fulcio certificate; docs/release.md has the
# verify-blob command with the exact identity and issuer.
signs:
  - id: checksums
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --yes
      - --bundle=${signature}
      - ${artifact}
    output: true

# The generated part of the release notes (the "## Changelog" section): one
# line per commit with its title only (no SHA), in git-log order (newest first,
# as GitHub lists pull requests; `sort: asc` would sort alphabetically by
# message, so none is set). `use: git` needs no API token. Our titles do not
# use feat:/fix: prefixes, so groups would only ever fill "Other changes";
# there are none. Housekeeping is filtered out, including only the version
# bump commits release.sh writes ("release: vX.Y.Z"), not real "release:" PRs.
changelog:
  use: git
  format: "{{ .Message }}"
  filters:
    exclude:
      - '^release: v[0-9]+\.[0-9]+\.[0-9]+'
      - '^docs?(\(.+\))?:'
      - '^test(s)?(\(.+\))?:'
      - '^chore(\(.+\))?:'
      - '^ci(\(.+\))?:'
      - '^Design:'
      - '^Merge '

release:
  github:
    owner: dimipaun
    name: fugaro
  # `auto` marks only semver-suffixed tags (v1.2.3-rc1) as pre-releases, and
  # the workflows accept strict vX.Y.Z tags alone, so it never fires. v0.1.0 to
  # v0.3.x are marked by the release workflow's last step, which asks
  # scripts/release-policy.sh; from v0.4.0 on a release is a normal one.
  prerelease: auto
  header: |
    ## Fugaro {{ .Tag }}

    Install:

    - Homebrew: `brew install dimipaun/tap/fugaro`
    - Go: `go install github.com/dimipaun/fugaro/cmd/fugaro@{{ .Tag }}`
    - Or download an archive below and verify it against `checksums.txt` (see docs/release.md).
    {{ with readFile (printf "docs/releases/%s.md" .Tag) }}
    ## Highlights

    {{ . }}
    {{ end }}
  footer: |
    ## Base images

    Published by the images workflow for this tag:

    - `ghcr.io/dimipaun/fugaro-history:{{ .Version }}` and `ghcr.io/dimipaun/fugaro-history:{{ .Major }}` (the sweeper and history job's image)
    - `ghcr.io/dimipaun/fugaro-base:{{ .Version }}` and `ghcr.io/dimipaun/fugaro-base:{{ .Major }}` (one index for linux/amd64 and linux/arm64; per-architecture tags `{{ .Version }}-amd64` and `{{ .Version }}-arm64`)
    - `ghcr.io/dimipaun/fugaro-credentials:{{ .Version }}` and `ghcr.io/dimipaun/fugaro-credentials:{{ .Major }}` (the credentials service's image, linux/amd64; signed, with the nightly-immune `{{ .Version }}-pinned` tag an ordinary `fugaro update` resolves and verifies when it pins the service it deploys)

    The images workflow then pulls each one with no login and fails if it is not public or lacks `linux/amd64` (and, for `fugaro-base`, `linux/arm64`); each image's digest is in that run's summary.

    The Terraform modules, the schemas and the plugin are versioned by this same tag.

# GoReleaser's current Homebrew mechanism (`brews` formulas are deprecated): a
# cask in dimipaun/homebrew-tap that installs the prebuilt binary (macOS;
# Linux is untested); `brew install dimipaun/tap/fugaro` resolves it. With no
# HOMEBREW_TAP_GITHUB_TOKEN (the workflow always exports it, possibly empty) the
# upload is skipped and the release still succeeds; a semver pre-release is
# skipped by `auto`.
homebrew_casks:
  - name: fugaro
    # The cask installs the mixed-licence build and stays on it (the owner's
    # answer of 2026-11-11): one tap cannot hold two archives of the same
    # OS/arch pair, and a second cask for the pure-MIT one is not wanted. The
    # core archive is a download, not an install path.
    ids: [fugaro]
    repository:
      owner: dimipaun
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    skip_upload: '{{ if eq .Env.HOMEBREW_TAP_GITHUB_TOKEN "" }}true{{ else }}auto{{ end }}'
    homepage: https://github.com/dimipaun/fugaro
    description: Fleeting cloud workers that run coding-agent tasks and always end with a pull request
    license: MIT AND LicenseRef-Fugaro-Subscription
    # The binary is not signed or notarized by Apple.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/fugaro"]
          end

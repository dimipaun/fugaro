<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      The installation picker's document (desktop-console plan Task 3.4b; owner
      ruling C9, 2026-10-18: the picker is a window of its own, opened from the
      application menu, and not a panel in the dashboard's header; owner's ruling
      of 2026-10-20: the console asks the operator for no binary and no config,
      so this document is a list and two onboarding screens and not a form).

      The CSP below is the **same string** as `index.html`'s and as the header
      `src/main/protocol.ts` attaches to every `app://` response: this document
      is served by the same protocol handler, so it gets the same header, and
      there is no delta for this document to have -- it is a second page of the
      same bundle, not a second policy. Which test holds *this* copy to the
      header is `console/test/unit/installations-ipc.test.ts` ("the picker's
      document"); `console/test/unit/window.test.ts` holds `index.html`'s and
      `refusal.html`'s, and does not read this file.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'; object-src 'none'"
    />
    <!--
      The one stylesheet this document links (desktop-console plan Task 6.2;
      design section 5.4): `./console.css`, the same file `index.html` and
      `refusal.html` link, served from this same origin by the same handler and
      admitted by the same `style-src 'self'`. The picker is a second page of
      the same bundle and not a second policy, so it has no stylesheet of its
      own and no inline style, style element or `'unsafe-inline'` either.
    -->
    <link rel="stylesheet" href="./console.css" />
    <title>Fugaro console — installations</title>
  </head>
  <body>
    <!--
      The picker's whole capability is one preload script and one bundle file,
      both served from this same origin and from nowhere else. The script is
      `installations.js`, and it is the **second entry** of the renderer
      bundler that Task 3.4a writes (`console/tools/bundle-renderer`): it walks
      the compiled CommonJS closure of an entry and writes one file per
      document, and this document's entry is `src/renderer/installations.ts`.
      That tool is **not on this branch** -- Task 3.4a owns it, and
      `console/README.md` says so -- so `./installations.js` is a file this
      document names and nothing yet produces. The tag is written here rather
      than left to that task because the document is this task's file; until
      3.4a lands, the request 404s and the page below is what is drawn.

      It is `defer` and it is a file, exactly as `index.html`'s script is: the
      CSP of rule 3 has no `'unsafe-inline'`, so an inline script would not run
      even if one were written, and `console/test/unit/installations-ipc.test.ts`
      asserts the tag's shape so that neither half can drift.

      Without the bundle the page still draws, and it draws nothing else: a
      heading, the status line and the three empty containers, which stay empty
      until the script arrives.
    -->
    <main>
      <h1>Installations</h1>
      <!--
        The status line, the list, the CLI's own warning lines, and the
        onboarding screen. The four containers are all this document declares;
        every child of them is built by `src/renderer/installations.ts`, so a
        row's text, a warning line and an onboarding screen are values the view
        wrote rather than markup this file carries.

        **There is no form here** (owner's ruling of 2026-10-20). The console
        asks the operator for no binary, no config and no project: the list is
        what `fugaro config list --json` printed, and the two screens below the
        heading are drawn when there is nothing to list. A test fails if the
        form's controls come back --
        `console/test/unit/installations-ipc.test.ts`, "the form is gone".
      -->
      <p id="picker-status">Reading the installation list…</p>
      <section id="picker-onboarding"></section>
      <ul id="picker-list"></ul>
      <ul id="picker-warnings"></ul>
    </main>
    <script src="./installations.js" defer></script>
  </body>
</html>

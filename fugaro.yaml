# fugaro.yaml — Fugaro running on its own repository (docs/dogfooding.md).
# Schema: https://raw.githubusercontent.com/dimipaun/fugaro/main/schemas/fugaro.schema.json
version: 1
project: fugaro
gcp_project: fugaro-dev

git:
  provider: github
  base_branch: main
  pr:
    # TODO(user): add your GitHub login (and a label if you want one) once the first run works.
    reviewers: []
    labels: []

agent:
  # The coder runs on `deepseek/deepseek-v4.1-flash` through OpenRouter (docs/multi-model.md), on the
  # OpenRouter API key (api-key: the budget gateway prices every call; the owner's local config sets
  # the caps). The in-loop senior review is a different, stronger model than the coder — the
  # `reviewer` model below, `claude-opus-5-5`, on the Claude account the local project config names
  # (stages.review.claude_account) — so a `standard` launch here does not resolve to L1 = L2, which
  # is what the review levels' guardrail (D721, docs/review-levels-ab-jobmax/) refuses by exact
  # model ID: this pair is why the refusal does not fire here.
  # The independent review can now run INSIDE the cloud loop on a Claude account: the per-stage
  # account setting exists (mixed credentials, the tasks B1-B6, docs/mixed-credentials/spec.md
  # §11), so an api-key run may name ONE stage-scoped account for its `review`, `adversarial` and
  # `triage` stages — `stages.<stage>.claude_account`, or the project's `default_claude_account`
  # where that stage's own model is an Anthropic one — and those three stages go direct to Anthropic on an Opus
  # model, which the gateway's ledger does not price at all (their dollars are the agent's own
  # figure, recorded as notional) and which no gateway caps. Both keys are the machine's and not
  # this file's: they live in the local project config, and the account reaches a run only once
  # that config is published into the project's policy node (`fugaro project policy publish`).
  # Naming an account is the owner's own step: the local project config names `bmb`
  # (stages.review.claude_account) and `fugaro update` publishes it, and a project that names an
  # account refuses a non-Anthropic reviewer at bootstrap, so the reviewer below is the Opus model
  # that account serves. The evidence that the mix works end to end is the mixed run's smoke test,
  # Check 290 of docs/gcp-live-checklist.md (owner-run).
  auth: api-key
  max_budget_usd: 500  # Claude Code prices a non-Anthropic model at Sonnet-like rates, about 25 times what the gateway charges for DeepSeek, so this per-stage limit is set high on purpose; the gateway's per-run cap (budget set --repo) is the real hard stop
  # The senior review's brief is this repository's own (.fugaro/review.md). It is read
  # from the run's base and never from the pull request's own branch (docs/design/v1.md),
  # so a change cannot review itself. It is here because of the owner's ruling of
  # 2026-11-06 — recorded in docs/mixed-credentials/spec.md §11, beside the two rulings
  # it builds on — that a run whose in-job review ran on Opus and passed gets no second
  # review by a person (until the job mounts the account's token, a DeepSeek review still gets a local one): the reviewer is told to read the whole change and check the claims against the
  # code, to run the targeted tests by name, to mutation-check a security-sensitive change
  # in a scratch tree, and to report only what must change before this is merged.
  review: .fugaro/review.md
  models:
    coder: deepseek/deepseek-v4.1-flash
    reviewer: claude-opus-5-5

# Follow-ups (fugaro run --pr N) act on PR comments, which on a public repository anyone can
# write: only the listed GitHub accounts (numeric IDs) are obeyed, and allow_public is the
# owner's explicit decision (2026-10-04: the maintainer only, dimipaun = 625256).
followup:
  trusted: ["625256"]
  allow_public: true

workflows:
  go:
    # The project image catalog's entry for this repository, built from
    # images/catalog/go/Dockerfile: the job's image is the catalog's choice and
    # not an image Fugaro builds for this repository (docs/repo-image-removal, R0).
    image_name: go
    commands:
      # The verify step must finish in about 20 minutes. It is NOT the merge gate:
      # GitHub CI is (go test -race ./..., the docker-tests, rules and terraform jobs).
      # Left out here: Docker (docker-tests) and the Firebase emulator (rules), which the
      # container can't run; -race; the live-tagged tests; and internal/runner and
      # internal/e2e, about 12 and 6 minutes each, internal/image and images (the base-image builds), whose tests need
      # Docker and a git checkout the container doesn't have. A change to those packages
      # should run them (CI does).
      # One test is left out with them, and it is the one that made ./scripts too big for
      # this step: TestLiveCheckScripts, which runs the bash tests of scripts/live-checks,
      # each driving a check's own script against fake tools on PATH. It is the bulk of the
      # package -- 4.6 minutes with it skipped, 13 with it -- and CI runs it on three runners
      # of its own (scripts-live-0..2). It is timing-sensitive too: beside the whole tree in
      # one invocation its Check 90 stream case failed, and that shard passes alone
      # (CHECK_TEST_SHARD=0/3 bash scripts/live-checks/check90_test.sh). The rest of
      # ./scripts -- the Check 480 and 481 tests, the CI hygiene, contract, deploy, notice
      # and release tests -- runs here, so a change to scripts/ still runs its package's
      # tests; a change to scripts/live-checks is what CI's runners are for.
      # internal/cli is the longest package here, past the 15m cap one `go test` puts on
      # every package it builds, so it runs as two invocations at once, cut by the first
      # letter of the test name. `^TestU` is its update and upgrade tests: nine of them wait
      # out a 30s or 60s deadline while they share a test binary with the rest of the
      # package, and alone they are under a minute. `^Test[^U]` is everything else, and the
      # two no longer keep that half inside 15m: on 2026-11-20, beside the other two
      # invocations, it ran to its own cap with TestWriterConformanceTheOwnerWritesTheKey --
      # the package's second-to-last test file -- still going, where
      # docs/test-time/measurement.md had measured the same half at 563 s alone on
      # 2026-11-17. So that half carries -timeout 20m: it is a bound and not a target, and
      # 20m beside the tree's own wall stays inside the 20 minutes this step targets and the
      # 25m `timeouts.verify`. Every test of the package still runs here, because the bound
      # moves and the selection does not; CI splits the same package by name too (cli-update
      # and cli-0..7).
      build: |
        set -e
        go build ./...
        go vet ./...
        test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      # Each of the three calls below goes through the `w` runner the script selects:
      # internal/verify/gotestjunit when the tree carries it, and the command itself when it
      # does not. That wrapper is why each one carries -json: `fugaro verify test` reads a
      # run's test counts, its failures and its flakes out of JUnit reports
      # (internal/verify/junit.go), and a stock `go test` writes none, so a run of this
      # repository recorded "0 tests" and warned about Java-shaped report globs it was never
      # given. The wrapper runs the command and writes the report the `reports` key below
      # names, and it exits with the command's own code, so rc is still the tests'. gotestsum
      # does the same job and is not in the job's image: images/catalog/go/Dockerfile installs
      # this repository's mise.toml tools and nothing else, so relying on one would mean an
      # image change.
      test: |
        rc=0
        # Not every tree this command runs against carries the wrapper: a follow-up or review
        # run reads commands.test from the base branch and checks out the pull request's tree
        # (internal/runner/followup.go), so a branch older than the wrapper would fail
        # `go run ./internal/verify/gotestjunit` and record a test failure on tests that pass.
        # Select the runner: with the wrapper present the command is wrapped and the reports
        # below are written; without it the command runs as a plain `go test`, whose exit code
        # is the tests' own either way. -json goes only to the wrapper, which is what reads the
        # stream -- a plain run would otherwise put the event stream in the log tail.
        if [ -f internal/verify/gotestjunit/main.go ]; then
          w() { go run ./internal/verify/gotestjunit "$@"; }
          json=-json
        else
          w() { shift 2; "$@"; }
          json=
        fi
        # Three invocations at once: the tree without internal/cli (with the live-check bash
        # tests skipped), and internal/cli in the two halves the comment above describes. The
        # cli exclusion is anchored, so internal/clidoc and ee/clidoc stay in.
        w --junitfile reports/tree.xml go test $json -timeout 15m -skip '^TestLiveCheckScripts$' $(go list ./... | grep -v -e /internal/runner -e /internal/e2e -e /internal/image -e /fugaro/images -e '/internal/cli$') &
        tree=$!
        w --junitfile reports/cli-update.xml go test $json -timeout 15m -run '^TestU' ./internal/cli/ &
        cliU=$!
        w --junitfile reports/cli-rest.xml go test $json -timeout 20m -run '^Test[^U]' ./internal/cli/ &
        cliRest=$!
        wait $tree || rc=$?
        wait $cliU || rc=$?
        wait $cliRest || rc=$?
        # The container's high-water memory since it started, the agent and the build cache
        # included (Cloud Run keeps the disk in memory): the number to size resources.memory by.
        for f in /sys/fs/cgroup/memory.peak /sys/fs/cgroup/memory/memory.max_usage_in_bytes; do
          if [ -r "$f" ]; then echo "peak memory: $(( $(cat "$f") / 1048576 )) MiB ($f)"; break; fi
        done
        exit $rc
      # The reports the wrapper writes, under the gitignored reports/ the .gitignore
      # explains. Naming them here is what keeps this workflow off config.DefaultReports,
      # whose Java-shaped globs (**/junit*.xml, **/build/test-results/**/*.xml) would
      # otherwise be the paths a reader was told to look under.
      reports: ["reports/**/*.xml"]
    resources: { cpu: 4, memory: 8Gi }
    timeouts: { total: 4h, stage: 3h, verify: 25m, finalize_reserve: 5m }

# fugaro.yaml — Fugaro running on its own repository (docs/dogfooding.md).
# Schema: https://raw.githubusercontent.com/dimipaun/fugaro/main/schemas/fugaro.schema.json
version: 1
project: fugaro
gcp_project: fugaro-dev

git:
  provider: github
  base_branch: main
  pr:
    # TODO(user): add your GitHub login (and a label if you want one) once the first run works.
    reviewers: []
    labels: []

agent:
  # The coder runs on `deepseek/deepseek-v4.1-flash` through OpenRouter (docs/multi-model.md), on the
  # OpenRouter API key (api-key: the budget gateway prices every call; the owner's local config sets
  # the caps). The in-loop senior review is a different, stronger model than the coder — the
  # `reviewer` model below, `claude-opus-5-5`, served by the `bmb` account — so a `standard` launch
  # here does not resolve to L1 = L2, which is what the review levels' guardrail (D721,
  # docs/review-levels-ab-jobmax/) refuses by exact model ID: this pair is why the refusal does not
  # fire here.
  # The independent review can now run INSIDE the cloud loop on a Claude account: the per-stage
  # account setting exists (mixed credentials, the tasks B1-B6, docs/design/mixed-credentials.md
  # §11), so an api-key run may name ONE stage-scoped account for its `review` and `adversarial`
  # stages — `stages.<stage>.claude_account`, or the project's `default_claude_account` where that
  # stage's own model is an Anthropic one — and those two stages go direct to Anthropic on an Opus
  # model, which the gateway's ledger does not price at all (their dollars are the agent's own
  # figure, recorded as notional) and which no gateway caps. Both keys are the machine's and not
  # this file's: they live in the local project config, and the account reaches a run only once
  # that config is published into the project's policy node (`fugaro project policy publish`).
  # Naming an account is the owner's own step: the local project config names `bmb` (stages.review
  # .claude_account) and `fugaro update` publishes it. The review stage runs on Opus, direct to
  # Anthropic and on that account, and the first-line review stays on the DeepSeek reviewer through
  # the gateway. Check 290 of docs/gcp-live-checklist.md is the smoke test that reads the mix back
  # from a real run (owner-run, not yet run).
  auth: api-key
  max_budget_usd: 500  # Claude Code prices a non-Anthropic model at Sonnet-like rates, about 25 times what the gateway charges for DeepSeek, so this per-stage limit is set high on purpose; the gateway's per-run cap (budget set --repo) is the real hard stop
  # The senior review's brief is this repository's own (.fugaro/review.md). It is read
  # from the run's base and never from the pull request's own branch (docs/design/v1.md),
  # so a change cannot review itself. It is here because of the owner's ruling of
  # 2026-11-06 — recorded in docs/design/mixed-credentials.md §11, beside the two rulings
  # it builds on — that a run whose in-job review passed gets no second review by a
  # person: the reviewer is told to read the whole change and check the claims against the
  # code, to run the targeted tests by name, to mutation-check a security-sensitive change
  # in a scratch tree, and to report only what must change before this is merged.
  review: .fugaro/review.md
  models:
    coder: deepseek/deepseek-v4.1-flash
    reviewer: claude-opus-5-5

# Follow-ups (fugaro run --pr N) act on PR comments, which on a public repository anyone can
# write: only the listed GitHub accounts (numeric IDs) are obeyed, and allow_public is the
# owner's explicit decision (2026-10-04: the maintainer only, dimipaun = 625256).
followup:
  trusted: ["625256"]
  allow_public: true

workflows:
  go:
    image:
      # Bake the module cache and a warm build cache into the derived image.
      setup: ["go mod download && go build ./..."]
    commands:
      # The verify step must finish in about 20 minutes. It is NOT the merge gate:
      # GitHub CI is (go test -race ./..., the docker-tests, rules and terraform jobs).
      # Left out here: Docker (docker-tests) and the Firebase emulator (rules), which the
      # container can't run; -race; the live-tagged tests; and internal/runner and
      # internal/e2e, about 12 and 6 minutes each, internal/image and images (the base-image builds), whose tests need
      # Docker and a git checkout the container doesn't have. A change to those packages
      # should run them (CI does).
      build: |
        set -e
        go build ./...
        go vet ./...
        test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      test: |
        go test -timeout 15m $(go list ./... | grep -v -e /internal/runner -e /internal/e2e -e /internal/image -e /fugaro/images)
    resources: { cpu: 4, memory: 8Gi }
    timeouts: { total: 3h, stage: 150m, verify: 25m, finalize_reserve: 5m }

# fugaro.yaml — Fugaro running on its own repository (docs/dogfooding.md).
# Schema: https://raw.githubusercontent.com/dimipaun/fugaro/main/schemas/fugaro.schema.json
version: 1
project: fugaro
gcp_project: fugaro-dev

git:
  provider: github
  base_branch: main
  pr:
    # TODO(user): add your GitHub login (and a label if you want one) once the first run works.
    reviewers: []
    labels: []

agent:
  # The cloud loop is all DeepSeek through OpenRouter (docs/multi-model.md), on the OpenRouter API
  # key (api-key: the budget gateway prices every call; the owner's local config sets the caps).
  # The in-loop senior review is a different, stronger OpenRouter model than the coder
  # (deepseek-v4-pro), so a `standard` launch here no longer resolves to L1 = L2: that is the pair
  # the review levels' guardrail (D721, docs/review-levels-ab-jobmax/) will refuse by exact model
  # ID once it ships, which nothing in the binary does today. The independent review stays OUTSIDE
  # the cloud loop (local agents) until the per-stage OAuth reviewer setting exists, so there is no
  # Claude model in the loop and no OAuth token on the job.
  auth: api-key
  max_budget_usd: 500  # Claude Code prices a non-Anthropic model at Sonnet-like rates, about 25 times what the gateway charges for DeepSeek, so this per-stage limit is set high on purpose; the gateway's per-run cap (budget set --repo) is the real hard stop
  models:
    coder: deepseek/deepseek-v4.1-flash
    reviewer: deepseek/deepseek-v4-pro
  # deepseek-v4-pro answers at most 16384 tokens a call; the review stage asks for 32000 unless limited,
  # and the gateway refuses that request.
  max_output_tokens:
    reviewer: 16384

# Follow-ups (fugaro run --pr N) act on PR comments, which on a public repository anyone can
# write: only the listed GitHub accounts (numeric IDs) are obeyed, and allow_public is the
# owner's explicit decision (2026-10-04: the maintainer only, dimipaun = 625256).
followup:
  trusted: ["625256"]
  allow_public: true

workflows:
  go:
    image:
      # Bake the module cache and a warm build cache into the derived image.
      setup: ["go mod download && go build ./..."]
    commands:
      # The verify step must finish in about 20 minutes. It is NOT the merge gate:
      # GitHub CI is (go test -race ./..., the docker-tests, rules and terraform jobs).
      # Left out here: Docker (docker-tests) and the Firebase emulator (rules), which the
      # container can't run; -race; the live-tagged tests; and internal/runner and
      # internal/e2e, about 12 and 6 minutes each, internal/image and images (the base-image builds), whose tests need
      # Docker and a git checkout the container doesn't have. A change to those packages
      # should run them (CI does).
      build: |
        set -e
        go build ./...
        go vet ./...
        test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      test: |
        go test -timeout 15m $(go list ./... | grep -v -e /internal/runner -e /internal/e2e -e /internal/image -e /fugaro/images)
    resources: { cpu: 4, memory: 8Gi }
    timeouts: { total: 3h, stage: 150m, verify: 25m, finalize_reserve: 5m }

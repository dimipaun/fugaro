# website/data/install.yaml -- the one install source the site renders.
#
# The paths below are in the order a reader runs them, and the **first path that names a
# system is that system's quick path**: `website/src/pages/getting-started.astro` draws one
# card per platform marked supported below and puts under it the first path whose own
# `platforms:` list carries that system's goos, with that path's command and copy control.
# Every path no card carries is rendered further down in the page's Details section. So the
# order is a fact about the page rather than a list, and a path moved above another is the
# path the systems that name both of them are offered first.
#
# Read as bytes by internal/cli/docs_website_install_test.go, which pins:
# every command below to the file its `source:` names (README.md's
# "## Getting started" or docs/release.md), verbatim; `build` to
# .goreleaser.yaml's builds[0]; the archive's name template and extension to
# archives[0]; the Homebrew line to homebrew_casks[0]; the platform list below
# to README.md's "## Requirements" and to .goreleaser.yaml, so that a platform
# no build produces may appear only marked untested and never as something a
# reader can install on; each path's own platform list to the source that
# offers it that path; and the absence of any version number. Nothing under
# website/ is importable by the Go module.
version: 1

# What this repository actually builds: darwin and linux on amd64 and arm64,
# and nothing else.
build:
  os: [darwin, linux]
  arch: [amd64, arm64]

# The reader-facing platform list, and the whole of what the site says about
# the operating systems a reader might be on (reconciliation D94). macOS and
# Linux are supported. Windows is untested: this repository builds no Windows
# binary, which is the whole of the Windows entry's note -- the redesign (P4)
# cut the WSL sentence that used to follow it, because a guess about an
# unverified route is not a fact this file can carry. The list is rendered as
# written -- the Windows entry is a note and never a platform a reader is
# offered.
platforms:
  - id: macos
    name: macOS
    goos: darwin
    status: supported
  - id: linux
    name: Linux
    goos: linux
    status: supported
  - id: windows
    name: Windows
    goos: windows
    status: untested
    note: >-
      Windows is untested: this repository builds no Windows binary.

paths:
  - id: homebrew
    name: Homebrew
    source: README.md
    platforms: [darwin]
    tap_repository: dimipaun/homebrew-tap
    note: The Homebrew cask (tested on macOS).
    commands:
      - |-
        brew install dimipaun/tap/fugaro

  - id: archive
    name: Archive
    source: README.md
    platforms: [darwin, linux]
    release_page: https://github.com/dimipaun/fugaro/releases
    name_template: "fugaro_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    extension: tar.gz
    note: >-
      A tarball for macOS or Linux, amd64 or arm64.

  - id: cosign
    name: Cosign
    source: docs/release.md
    platforms: [darwin, linux]
    note: >-
      Check the archive against the release's checksums.
    commands:
      - |-
        V=X.Y.Z
      - |-
        gh release download v$V -R dimipaun/fugaro -p checksums.txt -p checksums.txt.sigstore.json -p "fugaro_${V}_$(uname -s | tr A-Z a-z)_*"
      - |-
        cosign verify-blob checksums.txt \
          --bundle checksums.txt.sigstore.json \
          --certificate-identity "https://github.com/dimipaun/fugaro/.github/workflows/release.yml@refs/tags/v$V" \
          --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - |-
        grep " fugaro_${V}_$(uname -s | tr A-Z a-z)_" checksums.txt | shasum -a 256 -c -      # macOS
      - |-
        grep " fugaro_${V}_$(uname -s | tr A-Z a-z)_" checksums.txt | sha256sum -c -         # Linux

  - id: go-install
    name: Go install
    source: README.md
    platforms: [darwin, linux]
    dev_only: true
    note: >-
      For development only: a dev version with no release images and no plugin
      pin.
    commands:
      - |-
        go install github.com/dimipaun/fugaro/cmd/fugaro@latest

  - id: plugin
    name: Plugin
    source: README.md
    platforms: [darwin, linux]
    note: >-
      The agent's skills; fugaro init wires them into the checkout.
    commands:
      - |-
        fugaro init
      - |-
        /fugaro:setup
      - |-
        fugaro upgrade --local

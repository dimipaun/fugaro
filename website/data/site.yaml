# website/data/site.yaml -- the site's own facts.
#
# The values every page reads and nobody hard-codes: the canonical URL, the
# repository, what is switched on, the minimum sample a published figure may be
# drawn from, and the hosts the site's own link and origin checks admit. The
# site is a second artifact that lives in this repository under website/ (D90),
# and this file is how a fact about the site is stated once instead of typed
# into a component.
#
# Read as bytes by internal/cli/docs_website_boundary_test.go, which pins:
# `repository` to go.mod's own module path (so every GitHub link W1.7 builds
# points at this repository and at no other); `min_runs` to
# internal/stats.MinRuns (D97's N is 20 and it is one number, not two);
# `canonical_url` to a reserved placeholder origin whose host is on
# `allowed_hosts`, which is the state W2.2 leaves behind when it writes the real
# value; `secondary_domain` to empty, D92's answer being one domain and no
# redirect domain; `analytics` to a state where the flag and the measurement id
# agree, which holds whether or not W3.2 has turned it on -- that task sets the
# property and the flag together, behind W1.12's consent gate; both `features`
# to false, because the console is designed and not shipped and the explainer
# video does not exist yet (W3.1 flips the first with the console's release, and
# W2.4 the second); and every entry of `allowed_hosts` to a bare lowercase host.
# Each of those pins names in its failure the task that changes the value, so a
# later task meets a message that tells it what to do rather than one that
# argues with it.
#
# The same file is the source of the console-link rule that test enforces: while
# `features.console_downloads` is false, no file under website/ may carry a
# release-asset download URL of this repository (Global Constraint 9, finding
# 25) -- and this file states the rule without printing the shape it forbids,
# because the scan reads it too.
#
# Nothing under website/ is importable by the Go module, and the module gains no
# dependency from the site: that boundary is a test (the console boundary test's
# own shape), not a convention.
version: 1

# The one absolute URL the site's canonical <link>, its sitemap, its OpenGraph
# tag and every absolute link it prints are built from (W1.3).
#
# THIS IS A PLACEHOLDER, and it is a placeholder on purpose rather than an
# oversight: no domain is registered, nothing is deployed, and the value below
# is a reserved name (RFC 2606 / RFC 6761 -- `.example` can never resolve), so
# the canonical tag, the sitemap, the OpenGraph tag and every absolute link the
# site builds are wrong in a way a reader can see rather than wrong in a way
# that looks real. W2.2 is the task that replaces it with the canonical URL
# D92's answer names, once that domain exists and serves the site -- registering
# it, adding it to the site's own Firebase project and writing the DNS records
# are the owner's steps, and no agent registers a domain or touches DNS; a
# domain change is this line, the `allowed_hosts` entry below and a rebuild.
canonical_url: https://fugaro.example

# There is no second domain, and that is D92's answer rather than an unfinished
# value: one registered domain, no redirect domain, and therefore no redirect to
# write. W2.2 writes the firebase.json redirect block only for a domain that
# exists, and this value is where one would be named if the owner ever acquired
# one.
secondary_domain: ""

# The repository every GitHub link on the site is built from (W1.7): the docs
# hub links the guides it renders, the community page links CONTRIBUTING.md and
# the issue templates, and the install path links the Releases page. It equals
# go.mod's module path, so the site and the module name one repository.
repository: https://github.com/dimipaun/fugaro

# Analytics, which D93 answered on 2026-10-16 as Firebase Analytics behind a
# consent banner -- against the reconciliation's recommendation, which is why
# these two lines exist at all. `enabled` is false and stays false until W3.2
# sets the measurement id and turns the flag on; even then the load is decided
# by W1.12's consent gate and not by this flag, so nothing is fetched before a
# visitor consents either way. The two lines move together -- analytics that
# report nowhere and a property id that nothing reports to are both broken
# states -- and the test above holds them to that rather than to the value they
# happen to hold today, so W3.2 flips them without meeting a red test.
analytics:
  enabled: false
  measurement_id: ""

# The features the site renders only when they exist. The console is designed
# and not shipped (its release notes list it under "Not in this release"), so
# its section renders as a placeholder with no link and no button, and the test
# above refuses a download URL anywhere under website/ while this flag is false
# (D95). The explainer video does not exist yet, so the hero carries no player,
# no iframe, no poster and no play button (D107).
#
# Two tasks turn these on, and each of them edits the boundary test in the same
# commit (§7's file-conflict note): W3.1 flips `console_downloads` with the
# console's first release, and W2.4 flips `video` when the owner produces the
# video and the hero renders a slot for it.
features:
  console_downloads: false
  video: false

# D97's N: no figure the site publishes is drawn from fewer runs than this, and
# a group thinner than it is absent from the page rather than approximated. The
# value is internal/stats.MinRuns -- the aggregation's own minimum -- because the
# site publishes the aggregation's output and a second copy of its rule could
# disagree with the command that applies it.
min_runs: 20

# The host list the site's own checks enforce (W1.11): every external link is
# resolved against it, and every script, stylesheet, preload, image, iframe and
# font origin is compared with it, so a host that is not on the list fails the
# site's build rather than reaching a reader's browser. It carries the hosts the
# site actually links -- github.com for the repository, the Releases page and
# the issue templates, raw.githubusercontent.com for the documents the docs hub
# renders -- and the site's own canonical origin, and nothing else. The one
# third-party origin the owner decided on (D93's analytics script, loaded only
# after consent) is admitted by the consent task's own check, not by an entry
# here.
#
# The third entry is the canonical URL's own host, so it moves with
# `canonical_url` above: W2.2 replaces both lines in the same commit, and the
# test above fails until it does.
allowed_hosts:
  - github.com
  - raw.githubusercontent.com
  - fugaro.example

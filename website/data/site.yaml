# website/data/site.yaml -- the site's own facts.
#
# The values every page reads and nobody hard-codes: the canonical URL, the
# repository, what is switched on, the minimum sample a published figure may be
# drawn from, and the hosts the site's own link and origin checks admit. The
# site is a second artifact that lives in this repository under website/ (D90),
# and this file is how a fact about the site is stated once instead of typed
# into a component.
#
# Read as bytes by internal/cli/docs_website_boundary_test.go, which pins:
# `repository` to go.mod's own module path (so every GitHub link W1.7 builds
# points at this repository and at no other); `min_runs` to
# internal/stats.MinRuns (D97's N is 20 and it is one number, not two);
# `canonical_url` to an absolute https origin -- the origin alone, with no path,
# no query and no trailing slash -- whose host is a real host and is on
# `allowed_hosts` (W2.2 wrote the domain the owner registered and connected
# hosting to, replacing the reserved placeholder W0.2 wrote while no domain
# existed); the file to carry NO second domain, which W2.2 wrote for a domain the
# owner then ruled does not exist (the owner's ruling of 2026-10-17, recorded in
# the amendment under plan Task W2.2); `analytics` to a state where the flag and
# the measurement id agree, which holds whether or not W3.2 has turned it on --
# that task sets the property and the flag together, behind W1.12's consent
# gate; `features.console_downloads` to true, which W3.1 flipped with the
# console's first release in the commit that extended the console-link test
# below; `features.video` to false, because the explainer video
# does not exist yet (W2.4 flips it); and every entry of `allowed_hosts` to a
# bare lowercase host.
#
# Each of those pins names in its failure the task that changes the value, so a
# later task meets a message that tells it what to do rather than one that
# argues with it.
#
# The same file is the source of the console-link rule that test enforces: while
# `features.console_downloads` is false, no file under website/ may carry a
# release-asset download URL of this repository (Global Constraint 9, finding
# 25) -- and this file states the rule without printing the shape it forbids,
# because the scan reads it too. The flag is true now, and the rule the scan
# enforces in that state is the release's own: a URL under website/ has to be an
# asset of the console's release, which is why no file here carries one at all
# (every download URL is derived at build time from `website/content/downloads.json`).
#
# Nothing under website/ is importable by the Go module, and the module gains no
# dependency from the site: that boundary is a test (the console boundary test's
# own shape), not a convention.
version: 1

# The one absolute URL the site's canonical <link>, its sitemap, its OpenGraph
# tag and every absolute link it prints are built from (W1.3).
#
# This is the real domain and not the placeholder W0.2 wrote: the owner
# registered it and connected Firebase Hosting to it (owner ruling 2026-10-17),
# and the site's own Firebase project is `fugaro-prod` -- which firebase.json
# names nowhere and scripts/deploy-website.sh passes on the command line (D91).
# The value is the ORIGIN alone: no path, no query, no trailing slash, because
# every absolute link, the canonical tag, the sitemap and the OpenGraph tag are
# built from it and a path here would be copied into all of them.
#
# A domain change is this line, the `allowed_hosts` entry below and a rebuild --
# nothing else under website/ names the host, which
# TestWebsiteCanonicalHostAppearsOnlyInSiteYaml holds. Registering a domain,
# adding the custom domain and writing the DNS records stay the owner's steps
# (no agent registers a domain or touches DNS), and the live result is what
# check 69a of docs/gcp-live-checklist.md records.
#
# There is ONE domain, and no second one: the owner does not own a second
# domain (ruling of 2026-10-17, recorded in the amendment under plan Task W2.2),
# so nothing here names one and nothing redirects. TestWebsiteNamesNoSecondDomain
# in internal/cli/docs_website_boundary_test.go scans every file under website/
# for the name W2.2 wrote and refuses it coming back.
canonical_url: https://fugaro.dev

# The repository every GitHub link on the site is built from (W1.7): the docs
# hub links the guides it renders, the community page links CONTRIBUTING.md and
# the issue templates, and the install path links the Releases page. It equals
# go.mod's module path, so the site and the module name one repository.
repository: https://github.com/dimipaun/fugaro

# Analytics: D93 answered on 2026-10-16 as analytics behind a consent banner,
# against the reconciliation's recommendation, and the owner ruled on
# 2026-10-18 that the property is Google Analytics 4 with the measurement id
# below (the amendment under plan Task W3.2). The id is a PUBLIC identifier --
# it is in every page's source on the live site -- so it is a fact here, stated
# once, and never typed into a component: a second copy is a second value to
# keep in step, which is what the test in website/test/consent.mjs refuses.
#
# `enabled` decides whether the banner and its analytics configuration are
# emitted at all; it does NOT decide the load. That is W1.12's consent gate: the
# gate's code lives in website/public/scripts/site.js (D183 -- the site ships one
# first-party script file and no inline script), it reads the stored decision
# the banner writes, and it fetches nothing until the visitor has granted. So
# with the flag on and nobody consenting, the page still requests nothing from
# Google, and with the flag off there is no banner, no configuration and no
# analytics origin anywhere in the artifact.
#
# The two lines move together -- analytics that report nowhere and a property id
# that nothing reports to are both broken states -- and the boundary test holds
# them to that rather than to the value they happen to hold today, so clearing
# both turns the whole thing off with no other change.
analytics:
  enabled: true
  measurement_id: "G-DZ4F35D3EH"

# The campaign measurement's configuration (plan Task G2.3, reconciliation F17, F18,
# F22 and D401): the pixel's id, the insight tag's partner id, and the one origin
# each of the three loaders fetches its script from. It is a separate block from
# `analytics` above because it is a separate question, asked only on the four
# campaign pages and stored under its own key -- and a separate origin list
# because these origins are admitted by the consent check, not by
# `allowed_hosts` below, which lists the hosts the site LINKS to.
#
# **Both ids are the owner's, supplied on 2026-10-31: the partner id and then the
# pixel id.** This repository publishes no identifier the owner did not supply: an
# invented id would send a campaign page's visitors into a stranger's ad account,
# which is the one failure this file cannot take back. So all three loaders run on
# the four campaign pages behind the campaign consent, and an empty id is a
# loader switched off rather than a loader that loads something nameless -- which
# is why `internal/cli`'s boundary test now refuses either of these coming back
# empty. The origins are exact hosts and not wildcards: the plan pins the
# narrowest origin each vendor documents (O3), and `website/test/origins.mjs`
# holds the deployed policy to this exact list -- with one wildcard,
# `https://*.licdn.com` in `img-src`, which the owner ruled in explicitly and for
# that directive alone. Neither id is written anywhere else; the deployed policy
# is firebase.json's and its token list is the test's.
#
# The Calendly link is NOT here: it is `website/data/landing.yaml`'s
# `calendly_url`, one value with one home, and the banner carries it to the
# loader. What is here is only the origin Calendly's own widget script and
# stylesheet come from.
marketing:
  meta_pixel_id: "1128028360082828"
  meta_origin: "https://connect.facebook.net"
  linkedin_partner_id: "10341636"
  linkedin_origin: "https://snap.licdn.com"
  calendly_origin: "https://assets.calendly.com"

# The features the site renders only when they exist. The console is published:
# console/ holds the application, .github/workflows/console-release.yml signed,
# notarised and stapled its .dmg and .zip and packed its unsigned Linux pair, and
# its own release -- `console-v` plus the version in website/content/downloads.json
# -- carries all four (that file names the version and each asset's SHA-256). So its section renders the release's own downloads, and the
# test above holds every download URL to an asset of that release rather than
# refusing one (W3.1). The explainer video does not exist yet, so the hero
# carries no player, no iframe, no poster and no play button (D107).
#
# W3.1 flipped `console_downloads` with the console's first release, in the same
# commit that extended the boundary test (§7's file-conflict note); W2.4 flips
# `video` when the owner produces the video and the hero renders a slot for it.
features:
  console_downloads: true
  video: false

# D97's N: no figure the site publishes is drawn from fewer runs than this, and
# a group thinner than it is absent from the page rather than approximated. The
# value is internal/stats.MinRuns -- the aggregation's own minimum -- because the
# site publishes the aggregation's output and a second copy of its rule could
# disagree with the command that applies it.
min_runs: 20

# The host list the site's own checks enforce (W1.11): every external link is
# resolved against it, and every script, stylesheet, preload, image, iframe and
# font origin is compared with it, so a host that is not on the list fails the
# site's build rather than reaching a reader's browser. It carries the hosts the
# site actually links -- github.com for the repository, the Releases page and
# the issue templates, raw.githubusercontent.com for the documents the docs hub
# renders, firebase.google.com for Google's own Firebase privacy policy, which
# the privacy statement links rather than restating, calendly.com for the
# booking link the four campaign pages carry as a plain `Book a demo` anchor
# (G2.2; the inline embed G2.3 adds is the consent check's, not this list's),
# wa.me for the chat link the same section carries, whose address is the number
# `landing.yaml` writes (G2.4) -- and the site's own canonical origin, and
# nothing else. The one third-party
# origin the owner decided on (D93's analytics script, loaded only after
# consent) is admitted by the consent task's own check, not by an entry here.
#
# The last entry is the canonical URL's own host, so it moves with
# `canonical_url` above -- W2.2 replaced both lines in the same commit, which is
# what the test above holds them to. It is the only entry that is the site's
# own: every other entry is a host the site LINKS to, and a host the site does
# not link to does not belong here.
allowed_hosts:
  - github.com
  - raw.githubusercontent.com
  - firebase.google.com
  - calendly.com
  - wa.me
  - fugaro.dev

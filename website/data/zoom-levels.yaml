# website/data/zoom-levels.yaml — the four zoom levels, their words and the shapes they use
# (the brief of 2026-10-21, `docs/website/zoom-diagrams/spec.md`; D237, D244).
#
# This file is the drawing's words. `website/src/components/ZoomLevels.astro` renders one
# `<figure>` per level and reads every label from here, so the picture and its text cannot
# drift: a label a level does not render is a row nothing shows, and a label the component
# renders that is not a row here is a word the drawing wrote for itself. Both are refused by
# `website/test/how-it-works.mjs`.
#
# **Every row cites the document it is quoted from** (Global Constraint 6), and the component
# holds each one to that document at build time through `holdLabels` — a label that is not a
# line of the document it names stops the build rather than reaching a reader as the
# repository's own words. The sources are listed in `website/src/lib/zoom-labels.mjs`.
#
# **The labels are the brief's, corrected to what the runner does** (reconciliation §3): the
# cheap loop's reviewer is the coder's own model, in a fresh session, and the senior review is
# a loop bounded by `agent.review_rounds` rather than one final pass. Where the brief and the
# tree disagreed, the tree's sentence is the row.
#
#   - `id` is the anchor the level's markers point at: `#level-1` … `#level-4` (D245), and
#     Part 5's pinned section reuses these rather than adding a second set.
#   - `name` is the level's name, and it is a line of the brief — the headings the four levels
#     were asked for. It is the `<figcaption>` of the level's `<figure>`.
#   - `caption` is the line under the drawing. It is where the drawing says **which recipe it
#     is** (ZF7): level 1 is the loop, so its caption names the recipe that runs it.
#   - `parts` are the entities the level draws, in the order it draws them, and each one is a
#     `<symbol>` of the component's one `<defs>` drawn through `<use>` (D244). A part's
#     `entity` is one of the five: job, orchestrator, developer, console, project.
#   - `labels` are the words beside that entity, in the order they are drawn.

version: 1

levels:
  - id: level-1
    name:
      text: Inside a cloud job
      source: docs/website/zoom-diagrams/spec.md
    caption:
      text: Today's loop. A first-line review only when agent.first_line_review turns it on
      source: docs/recipes.md
    parts:
      - entity: job
        labels:
          - text: Cloud Run job per repository workflow
            source: README.md#How it works
          - text: one execution per task, then gone
            source: README.md#How it works
          - text: runs the build and tests through a recording wrapper
            source: README.md#How it works
          - text: the same model reviews, in a new session
            source: docs/recipes.md
          - text: then the senior review for agent.review_rounds rounds
            source: docs/recipes.md
          - text: marked ready only when the run passes
            source: README.md#How it works

  - id: level-2
    name:
      text: Orchestrator fans out jobs
      source: docs/website/zoom-diagrams/spec.md
    caption:
      text: run many tasks at once
      source: docs/SPEC.md
    parts:
      - entity: orchestrator
        labels:
          - text: Claude Code + fugaro plugin
            source: README.md#How it works
      - entity: job
        labels:
          - text: Cloud Run job per repository workflow
            source: README.md#How it works
      - entity: job
        labels:
          - text: one execution per task, then gone
            source: README.md#How it works
      - entity: job
        labels:
          - text: a draft opens at the first push
            source: README.md#How it works

  - id: level-3
    name:
      text: The developer's view
      source: docs/website/zoom-diagrams/spec.md
    caption:
      text: it is not released yet
      source: README.md
    parts:
      - entity: developer
        labels:
          - text: Your laptop runs the fugaro CLI
            source: README.md#Safety and cost controls
      - entity: console
        labels:
          - text: Fugaro also has a desktop console
            source: README.md
      - entity: orchestrator
        labels:
          - text: launches, watches and diagnoses runs
            source: README.md#Getting started
      - entity: job
        labels: []

  - id: level-4
    name:
      text: The whole project
      source: docs/website/zoom-diagrams/spec.md
    caption:
      text: in your own cloud project
      source: README.md#Why Fugaro
    parts:
      - entity: project
        labels:
          - text: Policy lives in the project, not on each laptop
            source: README.md
          - text: runs also share daily caps per repository and project
            source: README.md#Safety and cost controls
          - text: halt running runs within seconds
            source: README.md#Safety and cost controls
      - entity: developer
        labels:
          - text: Your laptop runs the fugaro CLI
            source: README.md#Safety and cost controls
      - entity: console
        labels: []
      - entity: orchestrator
        labels: []
      - entity: job
        labels: []

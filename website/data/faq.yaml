# website/data/faq.yaml -- the FAQ's answers and the file each one is traceable to (website
# plan, Task W1.10; findings 50-52, decisions D102 and D103).
#
# This is the FAQ's one source of truth, and the rule it is written to is the site's
# (Global Constraint 6): a page renders a fact, it never restates one. So every answer
# below carries the file in this repository that proves it, the page renders that file as
# the answer's source, and a build refuses an answer whose source is not in the tree --
# `website/src/pages/faq.astro` reads this file and stops, naming the entry, when it is not
# (website/test/faq-community.mjs holds that).
#
# What an entry is, and what each field is for:
#
#   id        the entry's anchor on the page, and the name a build error uses.
#   question  the heading a reader scans for.
#   answer    the site's own sentence, consistent with `source` and never a copy of it: a
#             page that repeats a document's sentences is the second copy of it, and the
#             copy that drifts first (F37, F47).
#   source    the file the answer is traceable to, relative to the repository root. The
#             page renders it as a link and fails the build if it is missing.
#   more_*    an optional second link, for the two answers whose job is to send a reader to
#             what carries the detail: the caps-and-costs page (figures and their
#             provenance) and the security page (which renders SECURITY.md, byte for byte
#             below its title -- a security claim is never paraphrased, F41, D99).
#
# **The redesign's cut (P4).** Every answer was 40-75 words and the page was 493; D188
# gives a page 250 words and its lead 40, so each answer is now one or two sentences and the
# lede no longer explains that the answers were not written here (D186). Nothing was dropped
# that a reader acts on: the file each answer names is still the file the page links, and the
# two answers whose detail lives elsewhere still link it. What went is the second sentence of
# every answer -- the one that said the same thing again, more carefully.
#
# The questions are the six W1.10 step 1 fixes, and they are deliberately the six the
# repository can answer: what Fugaro is, where the code runs, what a run costs and what
# stops it, what a failed run leaves behind, what a run can never change, and what the
# security model does not promise. The four spec sentences the product cannot back today --
# console downloads (D95), Windows/WSL (D94), the "~2 h" duration claim and the ballpark
# ranges (D96, D97) -- are not here, and no answer mentions a duration, a platform the
# build does not produce or a download that does not exist (F50, D102).
version: 1

# D103's owner review of this page is done: the owner approved the FAQ on 2026-10-17. The
# page carries no review state any more, and a `review_pending:` key is not one the page reads.

questions:
  - id: what-it-is
    question: What is Fugaro?
    answer: >-
      Ephemeral cloud jobs for coding agents: one task, one container, one pull request,
      then gone. The container does not survive the run.
    source: README.md

  - id: where-it-runs
    question: Where does the code run?
    answer: >-
      In your own Google Cloud project, not on a service of ours: each task is one Cloud Run
      job execution. AWS and Azure are not built.
    source: README.md

  - id: cost-and-caps
    question: What does a run cost, and what stops it?
    answer: >-
      By default each stage passes Claude Code a dollar limit (agent.max_budget_usd, 25),
      and kill switches stop running runs within seconds. The caps-and-costs page carries
      the figures.
    source: README.md
    more_label: Caps and costs
    more_href: /caps-and-costs/

  - id: a-failed-run
    question: What does a failed run leave behind?
    answer: >-
      A pull request, marked not verified, with the diff, the report and the logs. Fugaro
      never merges it: protect the base branch.
    source: README.md

  - id: workflow-files
    question: What can a run never change?
    answer: >-
      Your workflow files. On GitHub the App holds four repository permissions -- Contents,
      Pull requests, Issues and Metadata -- and never Workflows. Bitbucket has no equivalent
      guard.
    source: README.md

  - id: security-limits
    question: What does the security model not promise?
    answer: >-
      Not summarized here: the security model states its own limits, residual risks
      included, and the security page renders it.
    source: SECURITY.md
    more_label: The security page
    more_href: /security/

# **The comparison rows came out on 2026-10-21.** The owner's feedback on the preview: the
# section headed "How Fugaro compares" is empty, and it is removed. The rows were D103's
# `comparison:` list and the provenance rule (F51-F52) is exactly what kept it empty -- a
# claim about another tool needs a `source:` and a `date:`, and this repository has no network
# and records no sourced, dated fact about any other agent runner -- so what a reader met was
# a heading over a panel that said nothing. The key is gone from this file and the section is
# gone from the page; nothing else moved, and every answer above is the answer it was.
#
# Writing a `comparison:` key here again does not bring it back: the page reads `version` and
# `questions` and refuses every other key, so the build stops naming the key rather than
# leaving a fact in this file that nothing renders (W1.10 step 2).

# website/data/release-summaries.yaml -- the end-user summary of every release.
#
# One entry per file in docs/releases/, keyed by the release's tag, and the changelog page
# renders it under the release's heading with the release file's own Highlights collapsed
# below it (the owner's brief of 2026-10-19: the summary under each release is a product
# feature a reader understands, and the operator detail of docs/releases/vX.Y.Z.md is one
# click away). The release files are not edited by this and stay the source of an entry's
# full text.
#
# Each value is ONE line of plain text, and the sentence it carries is the whole of the
# entry: no colon, no quotes, no block scalar and no second line, so the file's shape is one
# the site's own YAML reader reads and the site's gates can hold every line to. The words are
# the site's rather than the release file's -- no task, phase or decision id, no internal
# file path, and no command-line flag unless the feature IS a command -- and a release the
# files do not cover is a line the changelog page stops the build for.
#
# Read by website/src/content.ts (loadReleaseSummaries), rendered by
# website/src/components/Changelog.astro, and pinned by website/test/changelog-page.mjs:
# every release file has an entry here, none is empty, and the page renders it.
#
# A new release adds its line here in the same commit as its docs/releases/vX.Y.Z.md: the
# summary is written for readers who use Fugaro, from what that file says the release does.
version: 1

summaries:
  v0.14.2: A run now pushes exactly the commit its test suite passed on and refuses to commit a stray binary, a review that answers nothing opens the pull request as a draft rather than a ready one, fugaro doctor counts the credential-side security checks on its default screen, and a launch from outside a repository's checkout is refused instead of guessed.
  v0.14.1: A single fugaro update now converges a whole installation and its checkout, migrating the published policy in place and moving the checkout's plugin pin and job images with it, fugaro doctor answers on one screen, and fugaro report and fugaro runs ls read a project's runs many times faster.
  v0.14.0: Runs can commit as the person who launched them and mark each commit with the run that made it, a phone can be paired to an installation by scanning a code and unpaired again, the installation's launchers and operators can be listed and changed one at a time, a Bitbucket token is sent only to Bitbucket or to a host you list, and a launch warns when a job's image is not the one its build record holds.
  v0.13.0: Fugaro now ships governance, fugaro report and the coordinator as business-licensed parts of the one released binary, while the core, fugaro runs digest and fugaro diagnose stay free, and a repository can bound its own runs with expectation tiers and a stage timeout that stops a run with a checkpoint.
  v0.11.4: The review-range fix from 0.11.3 now costs a handful of git calls however many branches a repository has, falls back safely on an old git, and the pull request and the run report say which commits the review covered. A run also records the backlog items it closed, and a pull request the coordinator cannot read stops using its read budget after three tries.
  v0.11.5: A plan status command shows every plan next to its runs and the planning skill now writes the plan graph for it, the review note counts other branches exactly, and the release script reads the stream version from one file.
  v0.11.6: The base image publishes and signs again so image refresh works, runs record their model calls and sub-agents per stage, and in a repository with rigor set up the mode thresholds now decide which findings block and Hotfix keeps only the security gate.
  v0.12.1: A project can set one default base branch that a repository's own configuration overrides, one Bitbucket workspace token can serve every repository a wildcard entry matches, and a daily budget cap now warns at 80%.
  v0.12.0: Run reviews can be committed with fugaro runs digest, every stage records its model calls and sub-agents, rigor modes bound fix rounds and name the findings they tolerated in repositories that set them up, and the coordinator view can be read without the GitHub key.
  v0.11.3: A run's review now looks only at the run's own commits even when it was cut from a long-lived branch without naming it, which stops reviews from reading a whole integration branch and spending the budget on it. fugaro run also takes its base from the branch you launch it from, and says so.
  v0.11.2: A run can now carry the id of the plan task it implements, recorded on the launch and shown in the runs list and in watch output, which the console's coming dependency graph reads. Fugaro also says when a requested rigor mode has no effect, and the setup guide is now one short page.
  v0.11.1: A run can now ask for a stricter rigor mode with --mode and --path, a launch warns before it starts on an image too old for a rigor setting, and follow-up runs close the backlog items they fix. The coordinator's token is narrower and is revoked after use, and the coordinator's background sweep ships switched off until an owner opts in.
  v0.11.0: Every repository now runs in a rigor mode that sets how much a run may spend, Pro by default, and reviewers score each finding so later releases can decide what blocks. Runs can file what they leave open into a backlog, a first coordinator view shows work in flight across a project, and the project now states which parts are open source and which are reserved.
  v0.10.4: fugaro setup now creates a fresh project and no longer offers to adopt an existing one. When billing cannot be linked, setup pauses instead of failing, writes your local configuration and prints one ready-to-forward message for whoever administers billing, and a rerun picks up where it stopped. A project created by setup is marked managed by default.
  v0.10.3: fugaro setup now says in one plain line what to ask your organization for when it cannot create the project or link billing, and the setup page describes a single path, a new project.
  v0.10.2: fugaro watch keeps failed runs as long as you ask, the guard that keeps agents out of workflow files no longer refuses a run it should not, fugaro plan graph refuses documents it used to guess at, and the security page says what the credentials service's account can write.
  v0.10.1: The credentials service is wired end to end and gets its own database role while staying dormant until an owner opts in, fugaro watch is easier to read, fugaro update --forget is safe on a managed installation, and a run's review and writeback now judge the same diff.
  v0.10.0: Setup now asks every question before it changes anything, a separate update command brings an existing installation up to date and the old init command is gone, a credentials service that keeps model credentials out of the job ships switched off until the next release wires it end to end, and managed projects are available again for a project Fugaro created or that its owner flags.
  v0.9.7: The job images publish again after 0.9.6's failed their security scan, so the cheaper review stage of 0.9.6 reaches cloud runs once a repository refreshes its images.
  v0.9.6: The first-run and upgrade commands are now fugaro setup and fugaro update, and cloud runs on long-lived branches review only their own change, so they cost far less.
  v0.9.5: The desktop console has a new dark design with a rail for your installations and full keyboard navigation, and a repository's spending caps and kill switch can be set from inside its checkout without typing its name. A project can now list which repositories are enrolled against those that have actually run, and enroll the repositories its GitHub App is installed on in one step.
  v0.9.0: A project's repositories can now share Cloud Run jobs, and a project can name several Claude accounts so a person's own subscription serves the project's runs from its own job. A run's budget token is sealed so no other run can use it, spend can be reported per person, and the watch screen names who launched each run.
  v0.8.7: The desktop console is published reliably again, because Apple's notarisation and stapling now retry the part that fails when Apple's service drops the connection. The command line itself is unchanged from the previous release.
  v0.8.6: Setup completes again on every installation, after the previous release stopped while creating an account's role. Managed projects and the batch provisioning step are switched off in this release, and both are planned to return after a redesign.
  v0.8.5: Fugaro can now manage a whole project, where an agent's infrastructure changes are applied by a deterministic gate, a lost project can be rebuilt from zero, and the project's budget alerts are recorded where no run can change them. The desktop console ships as its own signed macOS download, and a run can be given a title that names it in the watch screen and on the pull request it opens.
  v0.8.1: A project's Claude model claims are judged the way a run judges them, so validation stops halting on configurations that would work. A missing price is reported once, against the model it belongs to, and the watch screen hides pull requests that are already merged or closed when the GitHub CLI is installed.
  v0.8.0: A project's spending limits and the repositories allowed to run are now the project's own published data, and every run reads them before it starts. An operator can record which Claude models go direct and which go through a provider route, a secret can be stored once for the whole project, and a recipe can deliver a file instead of a pull request.
  v0.7.5: The base image is served from your registry rather than copied into it, and Fugaro checks a release's signature before it pins that image. A global per-run spending cap now bounds any repository without one of its own, a secret can be stored once for the whole project, and a configuration change that removes a workflow or an account can retire it without hand-run state surgery.
  v0.7.0: Every project now runs on one base image, so a repository declares the runtimes it needs instead of choosing a language image, and moving to it is a migration with its own steps. Recipes gained a catalog, a review mode for existing pull requests and check steps that gate a run, and the cloud storage that holds run data is hardened so a launcher reads it and writes only its own runs.
  v0.6.7: Runs on a provider model now report what they really cost, so a spending cap counts the actual amount instead of a worst-case estimate, and the first complete provider run works end to end. Fugaro also tells you when the cloud still carries an old copy of your project configuration.
  v0.6.6: Runs that drive a non-Anthropic model through OpenRouter now get past their first model call, so a coder and a reviewer on such a model can complete a task. Repositories that use only Claude models are unaffected.
  v0.6.5: A repository can use several named accounts instead of one, chosen per run or per repository, so a run that reaches an account's usage limit can be relaunched on another. Fugaro also tells you, at most once a day, when a newer release is available.
  v0.6.0: One command now moves a checkout to the newest Fugaro, pinning the plugin, updating it and refreshing the job images, and it can report what is out of date without changing anything. A project can publish defaults and named profiles that its repositories inherit, so a repository's own configuration file can shrink to a few lines. Fugaro's trust model and known limits are documented in one place.
  v0.5.1: Work in progress is no longer lost when a run's container dies, because new commits are pushed to the run's own branch within about a minute and a draft pull request opens at the first push. One command moves a repository onto the release's base image, and runs can be watched as they queue, start and finish.
  v0.5.0: The task loop is now a selectable recipe. You can pick one of the three that ship with Fugaro or write your own and share it with a whole project. A recipe only arranges the loop, so the models, the spending caps and the rule that a pull request is ready only with a passing test and a ship verdict are unchanged.
  v0.4.1: A checkout can be pointed at its installation's cloud project on its own, so a repository no longer has to be brought fully up to date first. Editors and the schema check accept that setting, and the setup skill now asks which models you want for the coder and for the reviewer.
  v0.4.0: A teammate can now launch runs in a repository they were merely given access to, because the installation's shared settings come from the cloud instead of from a setup step each person runs. Moving an existing Firebase project into Fugaro no longer needs hand-edited state, and a second project can sit beside the first.

# fugaro.yaml — how Fugaro builds and tests this repository.
# Schema: https://raw.githubusercontent.com/dimipaun/fugaro/main/schemas/fugaro.schema.json
# Check it with: fugaro validate
# If your project publishes a project layer, three lines are enough: version, project and gcp_project (fugaro config init). See docs/project-layer.md.
version: 1
# the Fugaro project; fugaro update --config-only writes your project config
project: example

git:
  provider: github            # github | bitbucket
  base_branch: main
  pr:
    labels: [fugaro]          # labels and reviewers are applied only when the PR is made ready
    reviewers: []
    # early_draft: true       # open the draft PR at the first checkpoint push (not verified yet); false: only at the end
    # checkpoints: true       # push each new commit within about a minute, and at every stage end (fast-forward only); false: only at verified stage ends and at the end

agent:
  auth: vertex                # vertex | api-key | oauth | cascade
  # model: claude-opus-5-5    # defaults to Claude Code's default model
  review_rounds: 2            # review → fix rounds before the PR is opened
  # first_line_review: auto   # auto | on | off: the coder's model reviews (and fixes) before the senior review; auto is on only with a provider coder
  # first_line_rounds: 1      # 1 to 3, apart from review_rounds
  # levels:                   # each review level's own settings, merged key by key with the project layer's defaults.agent.levels (fugaro 0.16.0)
  #   l1: { model: claude-haiku-4-5 }   # the first line of review; without it, the coder's own model
  #   l2: { effort: high }              # the senior round; effort is low | medium | high | xhigh | max
  #   l3: { none: true }                # the adversarial round; none: true turns a level off, beside no other key
  # adversarial_rounds: 3     # review level 3's rounds, 1 to 10, apart from review_rounds; unset takes the rigor mode's own default
  # recipe: default           # the task loop: default | solo | standard | a .fugaro/recipes/ or project recipe (fugaro 0.5.0 or later; the catalog's other recipes need 0.7.0)
  max_budget_usd: 25          # per stage, passed to claude --max-budget-usd
  # models:                   # a model per stage role; a role left out uses agent.model
  #   coder: claude-opus-5-5          # implement and fix; a budget needs an explicit model ID with a price
  #   reviewer: claude-sonnet-5-5     # review; same rule
  #   background: claude-haiku-4-5    # Claude Code's small background requests; a budget requires it
  # max_output_tokens: { coder: 64000, reviewer: 32000 }   # per call, 0 to 128000; 0 is no limit
  # max_run_tokens: 5000000   # the run's total tokens, 0 is none; can only tighten the project's ceiling
  # instructions: .fugaro/instructions.md   # appended to the agent's system prompt
  # review: /review           # a skill name, or a repo-relative prompt file

# budget:                     # optional; the repository's cost and model policy. It can only tighten the
#                             # project's ceiling (fugaro update); the runner reads it from the default branch,
#                             # a branch's looser value is ignored with a warning
#   mode: enforce             # off | observe | enforce; the strictest of the layers wins
#   per_run_usd: 5            # a dollar cap per run; the lowest of the layers wins
#   per_day_usd: 20           # this repository's dollars per UTC day, enforced by the runner; the lowest of the layers wins,
#                             # and a lower cap the owner set with `fugaro budget set` wins over it
#   allowed_models: [claude-opus-5-5, claude-sonnet-5-5, claude-haiku-4-5]   # explicit IDs, no aliases

# followup:                   # optional; who can steer a follow-up run (fugaro run --pr N)
#   # A follow-up agent holds the workflow's secrets, so only these accounts' PR comments reach it;
#   # the list is read from the base branch, so a PR can't widen it.
#   # review-only/pick (fugaro run --recipe NAME --pr N) reuse this same list: review mode is
#   # trusted-author-only (the repository's owner, members and collaborators, or Fugaro's own
#   # pull requests, are reviewed regardless; anyone else needs to be listed here too).
#   trusted: []               # GitHub: numeric user IDs (gh api users/<login> --jq .id)
#                             #   Bitbucket: account_id
#   allow_public: false       # refuse follow-ups on a public repository unless true

workflows:
  web:                        # workflow name, chosen with `fugaro run --workflow`
    image:                    # optional; rendered into the derived image (see `fugaro image render`)
      # tools: { node: "24" }   # or a mise.toml at the root (docs/base-image.md)
      apt: [fonts-liberation] # extra system packages
      # setup:                # extra RUN steps, run as fugaro in /work/repo after the dependency install
      #   - npx playwright install --with-deps chromium   # sudo works in setup steps, during the build only
      # skip_build_scripts: true   # install without package build scripts; commands.build must build what the tests need
    # dockerfile: .fugaro/web.Dockerfile   # escape hatch replacing the generated image; excludes image:
    commands:
      build: npm run build
      test: npm test
      # lint: npm run lint        # the check step's gate command (build | test | lint)
      # fix: npm run lint -- --fix   # the check step's autofix command; needs lint, since the gate runs fix, then lint
      reports: ["**/junit*.xml"]   # JUnit XML, such as jest-junit or Vitest's junit reporter
    secrets:                  # logical names; infrastructure maps them to Secret Manager
      # bitbucket-token, github-app-key, claude-oauth-token, anthropic-api-key, and anything
      # starting claude-oauth-token- (a named Claude account's own secret, set in the local
      # config's claude_accounts, never here) are reserved and refused as a workflow's own name
      - { name: npm-token, env: NPM_TOKEN }
    resources: { cpu: 4, memory: 8Gi }
    timeouts: { total: 90m, stage: 40m, verify: 30m, finalize_reserve: 5m }
    # rebuild:                # optional; the daily image check. A changed image:, dockerfile:, base or image.setup always rebuilds
    #   check: daily          # daily | off (off: rebuilt only by fugaro image build)
    #   max_age: 14d          # rebuild an image older than this (1h to 90d); 0 turns the age trigger off
    #   lockfiles: true       # rebuild when a cache key file changed on the base branch
    #   base: true            # rebuild when the base image's digest moved
    #   paths: []             # globs; a change under one on the base branch forces a rebuild

  server:
    # image: { apt: [postgresql-17, redis-server], setup: ["./gradlew --no-daemon testClasses"] }   # runtimes in mise.toml; services: docs/base-image.md
    commands:
      build: ./gradlew assemble
      test: ./gradlew test    # with services: fugaro-services start && TEST_SERVICES=local ./gradlew.sh integrationTest ...
      rerun_failed:           # optional; lets the agent prove a failure is flaky
        command: ./gradlew test
        each: "--tests {id}"  # appended once per failed test ID
      reports: ["**/build/test-results/**/*.xml"]
    secrets:
      - { name: artifactory-token, env: ARTIFACTORY_TOKEN }
    resources: { cpu: 8, memory: 32Gi }
    timeouts: { total: 90m, stage: 40m, verify: 30m, finalize_reserve: 5m }

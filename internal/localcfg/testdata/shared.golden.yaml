        m~AAECAwQFBgcICQoLDA0ODw: fugaro-mailbox-aurora
credentials_service:
    url: https://fugaro-credentials-abcde-uc.a.run.app
max_parallel: 7
repos:
    acme/web:
        provider: github
        workflows:
            - web

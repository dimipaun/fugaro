            mQIDAQAB
            -----END PUBLIC KEY-----
build:
    machine_type: E2_HIGHCPU_8
budget:
    mode: observe
    per_run_usd: 5
    rtdb_url: https://my-fp1-default-rtdb.firebaseio.com
    firebase_project: my-fp1
    firebase_api_key: AIzaFakeKeyForTests0123
    token_signer: signer@my-fp1.iam.gserviceaccount.com

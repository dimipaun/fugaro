# The shared package's tests (mobile plan, Task P4.3).
#
# Why the job is needed at all: shared/ (P0.1-P1.5) is a second artifact
# outside the Go module, like console/ and website/. `go test ./...`, `go vet`
# and `gofmt -l .` take no notice of it, and no job in ci.yml names it, so
# without this file the package's tests run only where someone runs them -- a
# real gap in the plan's coverage, recorded as one in
# docs/mobile/implementation-plan.md (open item 4) and in shared/README.md.
#
# The package has no dependencies at all, so `npm ci` here fetches nothing: it
# is the check that the committed package-lock.json really is installable, and
# it is the step a later dependency would ride in on.
#
# The shape of this file is pinned by
# internal/cli/docs_shared_tests_workflow_test.go, which parses this YAML --
# the pins, the permissions, the two Node versions, the trigger surface and the
# path filter. Read that test before editing anything here; an edit that widens
# the trigger or drops a version fails it. (That test scans these bytes for the
# names of the dangerous events and permissions, so this comment does not spell
# them out: a comment naming one would be refused exactly as a trigger would.)
#
# This file is the same file wherever it lives: it is staged under
# docs/pending-workflows/ for the owner to `cp` into .github/workflows/, with
# no edit in between and no staging banner to strip, because the test above
# requires the two copies to be byte-identical while both exist and to read the
# real one alone once the staged copy is gone. What staging means, and the
# owner's steps, are in the README beside this file.
name: shared-tests

# `shared/**` and this workflow's own path, and nothing else: the package, and
# the job that checks it. `main` only, for both events -- a branch push has no
# reason to run it, and a pull request from a fork runs it with no secret and
# no write scope, because it has neither.
on:
  push:
    branches: [main]
    paths:
      - "shared/**"
      - ".github/workflows/shared-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "shared/**"
      - ".github/workflows/shared-tests.yml"

# Least privilege, at the top so that no job can widen it by omission. The
# package's tests read the repository and write nothing: no blanket write
# grant, no scope beside `contents`, and no secret referenced anywhere in this
# file.
permissions:
  contents: read

# One run per ref: a second push to the same branch, or to the same pull
# request, cancels the run it superseded rather than letting both finish.
concurrency:
  group: shared-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Both Node lines are evidence about the same package; one of them
      # failing must not stop the other from reporting.
      fail-fast: false
      matrix:
        # Node 22 is the line shared/package.json's `engines` declares
        # (`>=22 <23`) and the line the package was written and checked on.
        # Node 26 is the current line, and running the same suite there is what
        # notices the day a runner major changes behaviour under a package
        # that never declared it -- which has already happened once: the
        # host-parser punycode case in shared/url/index.test.js answers
        # differently on the two lines (see the README beside this file).
        node: ["22", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The job reads the repository and pushes nothing.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      # No `cache: npm` here: the package has no dependencies, so there is
      # nothing to cache, and a cache key over a lockfile that pins nothing
      # would be decoration that can only ever go stale.
      - name: install the shared package
        working-directory: shared
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: the shared package's tests
        working-directory: shared
        run: npm test
      # The package's mutation proofs: each script breaks one guard in its
      # module and requires the module's tests to catch it, so this is the step
      # that keeps the suite from being merely green. There is one per module
      # that declares one, and the step globs for them rather than listing
      # them, so a module that adds a proof later is covered without an edit
      # here -- the list in the README beside this file is what a human reads.
      # They are shell scripts rather than npm scripts, so they are run by
      # name; each one finds its own node and REFUSES (exit 2) rather than
      # reporting mutations it never ran when it cannot -- which is why it is
      # worth running here, where a runner is known to exist.
      #
      # `shopt -s nullglob` so that an unmatched pattern is the empty list the
      # check below refuses, rather than a literal `shared/*/mutation-proof.sh`
      # that bash would try to execute and fail on for the wrong reason.
      - name: the shared package's mutation proofs
        run: |
          shopt -s nullglob
          proofs=(shared/*/mutation-proof.sh)
          if [ ${#proofs[@]} -eq 0 ]; then
            echo "shared/ carries no */mutation-proof.sh: the package's mutation proofs are gone" >&2
            exit 1
          fi
          for p in "${proofs[@]}"; do
            echo "== $p"
            bash "$p"
          done

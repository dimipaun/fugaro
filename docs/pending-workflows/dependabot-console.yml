# STAGED, NOT APPLIED. This file is the WHOLE of .github/dependabot.yml as it
# should read once Dependabot also watches console/package.json and its
# lockfile: the file that runs today plus the one `npm` update entry below.
# **It replaces .github/dependabot.yml, so its copy-in is `cp` over that path**
# -- it is not a file of its own under .github/workflows/, and nothing copies
# it to a path named after it.
#
# It is staged rather than applied because the owner reserved this decision.
# `docs/plans/2026-10-15-desktop-console.md`'s open item 5: Dependabot's scope
# is not extended by that plan, "`.github/dependabot.yml` is not under
# `.github/workflows/`, so an agent may edit it, and this plan deliberately does
# not: it belongs with Task 1.0's pins, and the owner may prefer to keep
# Dependabot's scope where it is rather than have a weekly PR stream behind an
# approval gate." The owner's ruling of 2026-10-22 answers it: stage the file
# here, with this copy-in step, and let them apply it.
#
# To apply it, from the repository root:
#
#     cp docs/pending-workflows/dependabot-console.yml .github/dependabot.yml
#     git rm docs/pending-workflows/dependabot-console.yml
#     git commit -m "dependabot: watch console/ (desktop-console plan, open item 5)"
#
# ... then update the two sentences that count what this directory holds, as
# the other staged files' copy-ins do: `docs/pending-workflows/README.md`'s
# opening line and its `## dependabot-console.yml` section, and the paragraph
# in `website/README.md` that says how many workflows are pending here.
# `TestDependabotConsoleStagingIsPinned`'s staging clause fails in each tree
# whose files and sentences disagree, so a copy-in that skips that step is red
# rather than silently stale.
#
# What the added entry is, and what it deliberately is not:
#
#   - It watches the console's npm dependencies, weekly, at the console's own
#     lockfile (`console/package-lock.json`, committed, `npm ci`-installed).
#     `console/package.json` pins every dependency to an EXACT version and
#     `test/unit/pinning.test.ts` enforces that, so a Dependabot pull request
#     is a reviewable exact-then-exact bump and never a range.
#   - It is **grouped**: minor and patch bumps arrive as one pull request a
#     week rather than one per dependency, which is what keeps a second
#     Dependabot stream from being a stream of approvals. **A major bump is
#     deliberately NOT in the group**, so the Electron major -- the one bump
#     the console's own toolchain task makes on purpose, and the one whose
#     binary is not an ordinary npm dependency at all (design section 5.2) --
#     arrives on its own for a deliberate look.
#   - The `github-actions` entry above it is unchanged, byte for byte: it keeps
#     the SHA-pinned actions current, and `images/cloudbuild_test.go` asserts a
#     weekly `github-actions` update is in this file.
#
# Dependabot keeps the SHA-pinned GitHub Actions current, updating both the
# pin and its "# vX.Y.Z" comment. Two pins it can't see are bumped by hand
# monthly, alongside the base refreshes: the Trivy digest in images/scan.sh
# and the "# syntax=docker/dockerfile" frontend digest in
# images/base/Dockerfile and images/derived/Dockerfile.tmpl.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # The console's own dependencies (desktop-console plan Task 1.0; design
  # section 5.2 and this plan's open item 5). `directory` is the console's
  # package directory rather than the repository root: there is exactly one
  # package.json in this repository that is an npm package, and it is there.
  - package-ecosystem: npm
    directory: /console
    schedule:
      interval: weekly
    groups:
      console:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

# Cloud Build config for one (repo, workflow) derived image (design §7.2).
# M4's `fugaro image build` submits it and M5's nightly trigger runs it;
# both set the substitutions.
#
# The git credential is the provider token the job already uses
# (fugaro-<slug>-bitbucket-token): fugaro writes its Secret Manager version
# into availableSecrets directly, and _GIT_USER names its https username.
# Only the two steps that clone see it, as GIT_TOKEN: source (the shallow clone render reads) and build
# (for the Dockerfile's own clone). Each checks REPO_URL is https://, writes
# a credential-store line (https://<user>:<token>@<host>, user and token
# percent-encoded) into a mktemp directory inside its own container, and
# removes it on exit. Nothing is written to /workspace or /builder/home, so
# the render step never sees a credential. The build passes its file as the
# git-credentials BuildKit secret, which no layer keeps.
#
# Render and build use one base image. Cloud Build pulls _FUGARO_BASE once,
# to run the render step; the build step does not pull again but pins the
# digest of that same local image (written to /workspace/base-digest), so a
# republished tag between the steps cannot give them different bases.
#
# Workflow secrets: _SECRET_ENVS is a space-separated list of variable
# names. This file declares none of them in availableSecrets or the build
# step's secretEnv; the request builder (gcp.BuildRequest) adds each one to
# both, so a trigger must build its request the same way rather than run
# this file as is. The build step passes each as an env BuildKit secret,
# which the template mounts with required=false.
#
# Substitution is textual, so no ${_…} ever appears in a step's shell
# script: a crafted value (a branch named x$(…) is a valid git ref) would
# run as shell next to the credential. Each value a script needs reaches it
# through the step's env: and is read as a quoted "$$VAR".
substitutions:
  _REPO_URL: ""       # https clone URL without credentials; also the checkout's origin
  _BASE_BRANCH: main
  _WORKFLOW: ""
  _FUGARO_BASE: ""    # ghcr.io/dimipaun/fugaro-<base>:<version>; build pins the render step's image by digest
  _IMAGE: ""          # the Artifact Registry image name, without a tag
  _GIT_USER: ""       # the token's https username, such as x-token-auth for Bitbucket
  _SECRET_ENVS: ""    # space-separated workflow secret variables; each is also in availableSecrets
options:
  logging: CLOUD_LOGGING_ONLY
availableSecrets:
  secretManager:
    - versionName: "set by fugaro image build: the provider token's Secret Manager version"
      env: GIT_TOKEN
steps:
  # A shallow clone, so render can read fugaro.yaml and the lockfiles.
  - id: source
    name: gcr.io/cloud-builders/git
    entrypoint: bash
    secretEnv: [GIT_TOKEN]
    env: ["BASE_BRANCH=${_BASE_BRANCH}", "REPO_URL=${_REPO_URL}", "GIT_USER=${_GIT_USER}"]
    args:
      - -c
      - |
        set -eu
        export LC_ALL=C
        # urlenc percent-encodes $$1 byte by byte (bash builtins only, so the
        # value never reaches an argv), as git's credential-store expects.
        urlenc() {
          local s=$$1 out= c i
          for ((i = 0; i < $${#s}; i++)); do
            c=$${s:i:1}
            case "$$c" in
              [A-Za-z0-9._~-]) out+=$$c ;;
              *) printf -v c '%%%02X' "'$$c"; out+=$$c ;;
            esac
          done
          printf '%s' "$$out"
        }
        case "$$REPO_URL" in https://*) ;; *) echo "REPO_URL must be an https URL" >&2; exit 1 ;; esac
        host=$${REPO_URL#https://}; host=$${host%%/*}
        case "$$host" in ""|*@*) echo "REPO_URL must name a host and no credentials" >&2; exit 1 ;; esac
        cred=$$(mktemp -d)
        trap 'rm -rf "$$cred"' EXIT
        (umask 077 && printf 'https://%s:%s@%s\n' "$$(urlenc "$$GIT_USER")" "$$(urlenc "$$GIT_TOKEN")" "$$host" > "$$cred/git-credentials")
        git -c credential.helper="store --file=$$cred/git-credentials" \
          clone --quiet --depth 1 --branch "$$BASE_BRANCH" -- "$$REPO_URL" /workspace/src
        install -d -m 0777 /workspace/context
  # The base image's own fugaro renders the Dockerfile. It runs as fugaro,
  # so the root-owned clone needs safe.directory.
  - id: render
    name: ${_FUGARO_BASE}
    dir: src
    entrypoint: sh
    env: [GIT_CONFIG_COUNT=1, GIT_CONFIG_KEY_0=safe.directory, "GIT_CONFIG_VALUE_0=*", "WORKFLOW=${_WORKFLOW}"]
    args: [-c, 'fugaro image render --workflow "$$WORKFLOW" > /workspace/context/Dockerfile']
  # Reuses the exact base image the render step ran (no second pull), so a
  # republished tag between the steps cannot split render and build. The
  # Dockerfile clones the full base branch itself, with the credential as a
  # BuildKit secret, and pins nothing but that base digest.
  - id: build
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    secretEnv: [GIT_TOKEN]
    env:
      - DOCKER_BUILDKIT=1
      - "FUGARO_BASE=${_FUGARO_BASE}"
      - "REPO_URL=${_REPO_URL}"
      - "BASE_BRANCH=${_BASE_BRANCH}"
      - "IMAGE=${_IMAGE}"
      - "SECRET_ENVS=${_SECRET_ENVS}"
      - "GIT_USER=${_GIT_USER}"
    args:
      - -c
      - |
        set -eu
        export LC_ALL=C
        # urlenc percent-encodes $$1 byte by byte (bash builtins only, so the
        # value never reaches an argv), as git's credential-store expects.
        urlenc() {
          local s=$$1 out= c i
          for ((i = 0; i < $${#s}; i++)); do
            c=$${s:i:1}
            case "$$c" in
              [A-Za-z0-9._~-]) out+=$$c ;;
              *) printf -v c '%%%02X' "'$$c"; out+=$$c ;;
            esac
          done
          printf '%s' "$$out"
        }
        case "$$REPO_URL" in https://*) ;; *) echo "REPO_URL must be an https URL" >&2; exit 1 ;; esac
        host=$${REPO_URL#https://}; host=$${host%%/*}
        case "$$host" in ""|*@*) echo "REPO_URL must name a host and no credentials" >&2; exit 1 ;; esac
        cred=$$(mktemp -d)
        trap 'rm -rf "$$cred"' EXIT
        (umask 077 && printf 'https://%s:%s@%s\n' "$$(urlenc "$$GIT_USER")" "$$(urlenc "$$GIT_TOKEN")" "$$host" > "$$cred/git-credentials")
        base=$$(docker image inspect --format '{{index .RepoDigests 0}}' "$$FUGARO_BASE") \
          || { echo "the render step's base image is not on this worker" >&2; exit 1; }
        printf '%s\n' "$$base" > /workspace/base-digest
        echo "base $$base"
        set --
        for e in $$SECRET_ENVS; do
          case "$$e" in *[!A-Z0-9_]*) echo "bad secret variable name" >&2; exit 1 ;; esac
          set -- "$$@" --secret "id=$$e,env=$$e"
        done
        docker build --progress plain \
          --build-arg "FUGARO_BASE=$$base" \
          --build-arg "REPO_URL=$$REPO_URL" \
          --build-arg "BASE_BRANCH=$$BASE_BRANCH" \
          --secret "id=git-credentials,src=$$cred/git-credentials" \
          "$$@" \
          --tag "$$IMAGE:latest" /workspace/context
images: ["${_IMAGE}:latest"]

# The secret scanner's config for the Fugaro images (images/scan.sh --secrets,
# design base-image.md section 7): the rules Trivy's own do not state, and the
# allowances a finding may be excused by.
#
# rules are *added* to Trivy's built-in rules, never in place of them (checked
# against the pinned Trivy on 2026-11-16: a config with rules still reports a
# private key and a GitHub token). They cover the four places a build's
# credential can survive in that no built-in rule names -- Trivy's own rules
# match token *formats* (a GitHub PAT, an AWS key, a private key), and none of
# them is the shape a git credential takes: a `.netrc`, a credential-helper
# store, a git config that points at one. The environment is the fourth place
# and the one these rules cannot reach: Trivy's image-config scan applies only
# its built-in rules, so a variable named like a credential is refused by
# images/scan.sh's own check instead.
#
# Each rule reads one path pattern (a regular expression over the file's path)
# for a reason written next to it. A rule here is the whole of a place's
# coverage *per layer*: Trivy analyses each layer separately, so a credential a
# later layer deleted is still a finding.
rules:
  # Every layer, the image's own files: a .netrc is a credential file whoever
  # wrote it, and nothing in a Fugaro image has one legitimately.
  - id: fugaro-netrc
    category: Fugaro credential leak
    title: A .netrc file
    severity: CRITICAL
    path: '(^|/)(\.netrc|_netrc)$'
    regex: '(?m)^.+$'

  # The credential-helper store git writes for `credential.helper = store`,
  # which holds the token in clear text. The same file
  # images/common/finalize-checkout.sh removes from a baked checkout.
  - id: fugaro-git-credentials
    category: Fugaro credential leak
    title: A git credential-helper store
    severity: CRITICAL
    path: '(^|/)\.git-credentials$'
    regex: '(?m)^.+$'

  # A git config that carries a credential rather than a name: a credential
  # helper, an http.extraheader, or a URL whose userinfo holds a secret. The
  # pattern is images.GitConfigCredentialText verbatim (a test pins it), read
  # here over the file's text instead of `git config --get-regexp`'s output;
  # scan.sh's own check greps the same text out of a baked checkout's
  # .git/config, which Trivy never reads — its walk leaves a directory named
  # .git out (checked on the pinned Trivy, 2026-11-16) — and the alternative is
  # kept here for a reader that ever stops skipping it.
  - id: fugaro-git-config-credential
    category: Fugaro credential leak
    title: A git config that carries a credential
    severity: CRITICAL
    path: '(^|/)(\.gitconfig|gitconfig|\.git/config)$'
    regex: '(?im)\[credential|^[[:space:]]*helper[[:space:]]*=|extraheader|://[^/@[:space:]]+:[^/@[:space:]]+@'
# Allowances: each entry allows one path pattern for a reason written next to
# it -- a test fixture inside a vendored package, never a rule turned off
# everywhere. An empty list is the goal.
allow-rules: []
